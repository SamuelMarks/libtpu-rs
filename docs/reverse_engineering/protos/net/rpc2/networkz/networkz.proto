syntax = "proto3";
package net_rpc2_networkz;
import "net/util/transport_metrics.proto";
import "util/task/status.proto";
message TcpInfoMetrics {
  uint32 state = 1;
  uint32 ca_state = 2;
  uint32 retransmits = 3;
  uint32 probes = 4;
  uint32 backoff = 5;
  uint32 options = 6;
  uint32 snd_wscale = 7;
  uint32 rcv_wscale = 8;
  uint32 delivery_rate_app_limited = 9;
  uint32 rto = 11;
  uint32 ato = 12;
  uint32 snd_mss = 13;
  uint32 rcv_mss = 14;
  uint32 unacked = 15;
  uint32 sacked = 16;
  uint32 lost = 17;
  uint32 retrans = 18;
  uint32 packets = 19;
  uint32 last_data_sent = 20;
  uint32 last_ack_sent = 21;
  uint32 last_data_recv = 22;
  uint32 last_ack_recv = 23;
  uint32 pmtu = 24;
  uint32 rcv_ssthresh = 25;
  uint32 rtt = 26;
  uint32 rttvar = 27;
  uint32 snd_ssthresh = 28;
  uint32 snd_cwnd = 29;
  uint32 advmss = 30;
  uint32 reordering = 31;
  uint32 rcv_rtt = 32;
  uint32 rcv_space = 33;
  uint32 total_retrans = 34;
  uint64 pacing_rate = 35;
  uint64 max_pacing_rate = 36;
  uint64 bytes_acked = 37;
  uint64 bytes_received = 38;
  uint32 segs_out = 39;
  uint32 segs_in = 40;
  uint32 notsent_bytes = 41;
  uint32 min_rtt = 42;
  uint32 data_segs_in = 43;
  uint32 data_segs_out = 44;
  uint64 delivery_rate = 45;
  uint64 busy_time = 46;
  uint64 rwnd_limited = 47;
  uint64 sndbuf_limited = 48;
  uint32 delivered = 49;
  uint32 delivered_ce = 50;
  uint64 bytes_sent = 51;
  uint64 bytes_retrans = 52;
  uint32 dsack_dups = 53;
  uint32 reord_seen = 54;
  uint32 rcv_ooopack = 55;
  uint32 snd_wnd = 56;
  uint32 rcv_wnd = 57;
  uint32 rehash = 58;
  uint32 total_rto = 59;
  uint32 total_rto_recoveries = 60;
  uint32 total_rto_time = 61;
}
message NetworkzResponse {
  .util.StatusProto status = 1;
  .net_rpc2_networkz.TcpInfoMetrics tcp_info_metrics = 2;
  .util.StatusProto timestamp_error = 3;
  .transport_metrics_log.Timestamps timestamps = 4;
}
