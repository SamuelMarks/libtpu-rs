syntax = "proto3";

package stream_executor;

message CudaComputeCapabilityProto {
  enum FeatureExtension {
    NONE = 0;
    ACCELERATED_FEATURES = 1;
    FAMILY_SPECIFIC_FEATURES = 2;
  }

  int32 major = 1;
  int32 minor = 2;
  FeatureExtension feature_extension = 3;
}
