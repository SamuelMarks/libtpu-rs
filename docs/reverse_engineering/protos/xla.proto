syntax = "proto3";

package xla;

import "google/protobuf/any.proto";
import "hlo.proto";
import "xla_data.proto";

option cc_enable_arenas = true;

message CompilationEnvironmentsProto {
  repeated bytes environments = 1;
}

message DebugOptions {
  enum StepMarkerLocation {
    STEP_MARK_AT_ENTRY = 0;
    STEP_MARK_AT_TOP_LEVEL_WHILE_LOOP = 1;
    STEP_MARK_AT_SECOND_LEVEL_WHILE_LOOP = 2;
    STEP_MARK_NONE = 3;
  }
  string xla_dump_to = 1;
  bool xla_dump_hlo_as_text = 2;
  bool xla_dump_hlo_as_proto = 3;
  string xla_dump_hlo_pass_re = 4;
  string xla_dump_hlo_module_re = 5;
  bool xla_dump_hlo_snapshots = 6;
  int32 xla_backend_optimization_level = 31;
  repeated string xla_disable_hlo_passes = 32;
  repeated string xla_enable_hlo_passes_only = 33;
  bool xla_tpu_detect_nan = 64;
  bool xla_tpu_detect_inf = 65;
  bool xla_enable_fast_math = 66;
  bool xla_gpu_enable_triton_gemm = 67;
  bool xla_tpu_enable_async_collective_fusion = 68;
  bool xla_tpu_enable_ag_backward_pipelining = 69;
  bool xla_tpu_enable_rs_forward_pipelining = 70;
  bool xla_tpu_overlap_compute_collective_tc = 71;
  bool xla_tpu_use_shardy_partitioner = 72;
  int64 xla_latency_hiding_scheduler_limit = 73;
}

message ExecutionOptions {
  enum EffortLevel {
    EFFORT_UNKNOWN = 0;
    EFFORT_O0 = 1;
    EFFORT_O1 = 2;
    EFFORT_O2 = 3;
    EFFORT_O3 = 4;
  }
  int32 num_replicas = 1;
  int32 num_partitions = 2;
}

message HloModuleConfigProto {
  xla.ProgramShapeProto entry_computation_layout = 1;
  uint64 seed = 2;
  int32 launch_id = 3;
  int64 replica_count = 4;
  int64 num_partitions = 5;
  repeated bool param_requires_broadcast_via_collectives = 6;
  bool use_spmd_partitioning = 7;
  bool use_auto_spmd_partitioning = 8;
  repeated int64 auto_spmd_partitioning_mesh_shape = 9;
  repeated int64 auto_spmd_partitioning_mesh_ids = 10;
  bool deduplicate_hlo = 11;
  int64 intra_op_parallelism_threads = 12;
  string device_type = 13;
  DebugOptions debug_options = 14;
  xla.DeviceAssignmentProto static_device_assignment = 15;
  bool alias_passthrough_params = 17;
  repeated bool allow_spmd_sharding_propagation_to_output = 23;
  int32 matrix_unit_operand_precision = 29;
  int64 device_memory_size = 32;
  repeated bool allow_spmd_sharding_propagation_to_parameters = 33;
  bool use_shardy_partitioner = 34;
}

message HloModuleProtoWithConfig {
  HloModuleProto hlo_module = 1;
  HloModuleConfigProto config = 2;
}
