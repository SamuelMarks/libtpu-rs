message FusionConfig {
  message PerComputationConfig {
    repeated bool fused_nodes = 1;
  }
  repeated .xla.tuning.FusionConfig.PerComputationConfig computations = 1;
}
message DotConfig {
  message PerNodeDotConfig {
    optional int32 input_feature_dim = 1;
    optional int32 output_feature_dim = 2;
    optional int32 batch_dim = 3;
  }
  repeated .xla.tuning.DotConfig.PerNodeDotConfig nodes = 1;
}
message NodeLayoutConfig {
  message TensorLayoutConfig {
    repeated int32 dims = 1;
  }
  repeated .xla.tuning.NodeLayoutConfig.TensorLayoutConfig tensors = 1;
}
message LayoutConfig {
  repeated .xla.tuning.NodeLayoutConfig nodes = 1;
}
message ModuleFlagConfig {
  optional .xla.tuning.ModuleFlagType flag_type = 1;
  optional string value = 2;
}
message FlagConfig {
  repeated .xla.tuning.ModuleFlagConfig flags = 1;
}
message MemorySpaceAssignmentConfig {
  repeated uint64 order = 1 [packed = true];
}
message HloModuleConfig {
  reserved 5;
  optional .xla.tuning.FusionConfig fusion_config = 1;
  optional .xla.tuning.DotConfig dot_config = 2;
  optional .xla.tuning.LayoutConfig layout_config = 3;
  optional .xla.tuning.FlagConfig flag_config = 4;
  optional .xla.tuning.MemorySpaceAssignmentConfig memory_space_assignment_config = 6;
  optional .xla.ShardingConfigProto sharding_config = 7;
  optional .xla.ScheduleConfigProto schedule_config = 8;
}
