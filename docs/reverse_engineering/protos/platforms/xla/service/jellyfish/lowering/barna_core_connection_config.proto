syntax = "proto3";
package xla.jellyfish;
import "platforms/deepsea/jellyfish/api/tensor_core_barna_core_communication_configuration.proto";
message BarnaCoreConnectionConfig {
  reserved 4;
  reserved "hbm_base_word_address_map";
  message Common {
    reserved 3;
    reserved "max_size_in_bytes_per_barna_core";
    int32 input_batch_size = 1;
    int32 barna_clump_count_per_tensor_core = 5;
    int32 barna_core_count_per_row = 6;
    repeated int32 tpu_sample_counts_per_input_sample = 2;
    .platforms_deepsea.jellyfish.api.DmaDestination dma_destination = 4;
  }
  message ActivationInfeed {
    .xla.jellyfish.BarnaCoreConnectionConfig.Common common = 1;
    .platforms_deepsea.jellyfish.api.TensorCoreBarnaCoreFeedConfiguration.Infeed infeed = 2;
  }
  message DeduplicationDataInfeed {
    .platforms_deepsea.jellyfish.api.TensorCoreBarnaCoreFeedConfiguration.Infeed infeed = 1;
    int32 barna_clump_count_per_tensor_core = 5;
    bool software_deduplication_enabled = 2;
    int64 total_deduplication_data_transfer_size_in_bytes = 3;
    repeated int64 deduplication_data_transfer_sizes_in_bytes = 4;
  }
  message Outfeed {
    .xla.jellyfish.BarnaCoreConnectionConfig.Common common = 1;
    .platforms_deepsea.jellyfish.api.TensorCoreBarnaCoreFeedConfiguration.Outfeed outfeed = 2;
  }
  oneof config {
    .xla.jellyfish.BarnaCoreConnectionConfig.ActivationInfeed activation_infeed = 1;
    .xla.jellyfish.BarnaCoreConnectionConfig.DeduplicationDataInfeed deduplication_data_infeed = 3;
    .xla.jellyfish.BarnaCoreConnectionConfig.Outfeed outfeed = 2;
  }
}
