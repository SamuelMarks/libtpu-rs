import "platforms/asic_sw/lib/deepsea/gxc/glc/isa/sparsecore/sparsecore_tac_program.proto";
import "platforms/asic_sw/lib/deepsea/gxc/glc/isa/sparsecore/sparsecore_tec_program.proto";
