syntax = "proto3";
package xla.memory_space_assignment;
message SlicedPrefetchOptions {
  uint32 max_slices = 1;
  uint64 min_bytes = 2;
  bool fail_on_non_alignment_boundary_slice_proposal = 3;
  uint32 all_slice_time_permutations_threshold = 4;
  uint64 preferred_slice_size = 5;
}
message MemoryBoundLoopOptimizerOptions {
  optional bool enabled = 1;
  optional float desired_copy_ratio = 2;
  optional bool allow_unsatisfied_fully_pipelined_prefetch = 3;
  optional float min_num_iterations = 4;
}
message TupleShapeIndex {
  repeated int64 index = 1;
}
message HloOperandFilter {
  optional string instruction_name_regex = 1;
  optional int64 operand_number = 2;
  optional int64 size_gte = 3;
  optional int64 size_lte = 4;
  optional .xla.memory_space_assignment.TupleShapeIndex tuple_index = 5;
  optional string instruction_regex = 6;
}
message PreferredPrefetchOverrideOptions {
  reserved 2;
  reserved 3;
  reserved "after_instruction_name";
  reserved "before_instruction_name";
  oneof options {
    float prefetch_eagerness = 1;
    .xla.memory_space_assignment.HloPositionMatcher after_instruction = 4;
    .xla.memory_space_assignment.HloPositionMatcher before_instruction = 5;
    int64 logical_time = 6;
  }
  optional bool strict_timing = 7;
}
message PreferredPrefetchOverride {
  optional .xla.memory_space_assignment.HloOperandFilter hlo_operand_filter = 1;
  optional .xla.memory_space_assignment.PreferredPrefetchOverrideOptions override_options = 2;
  optional bool fail_on_unsatisfied_override = 3;
}
message PreferredPrefetchOverrides {
  repeated .xla.memory_space_assignment.PreferredPrefetchOverride overrides = 1;
  optional bool fail_on_unsatisfied_override = 2;
}
message HloRandomFilter {
  optional int64 seed = 1;
  optional double selection_range_begin = 2;
  optional double selection_range_end = 3;
}
message HloPositionMatcher {
  optional string instruction_regex = 1;
  optional string instruction_name_regex = 2;
  optional .xla.memory_space_assignment.TupleShapeIndex tuple_index = 3;
  optional int64 size_gte = 4;
  optional int64 size_lte = 5;
  optional .xla.memory_space_assignment.HloOperandFilter hlo_use_filter = 6;
  optional .xla.memory_space_assignment.HloRandomFilter hlo_random_filter = 7;
}
message MsaSortOrderOverrideOptions {
  oneof options {
    bool assign_first = 1;
    bool assign_last = 2;
    int64 assign_value = 3;
  }
}
message MsaSortOrderOverride {
  optional .xla.memory_space_assignment.HloPositionMatcher hlo_position_matcher = 1;
  optional .xla.memory_space_assignment.MsaSortOrderOverrideOptions override_options = 2;
  optional bool apply_to_cross_program_prefetches = 3;
}
message MsaSortOrderOverrides {
  repeated .xla.memory_space_assignment.MsaSortOrderOverride overrides = 1;
}
message PinInAlternateMemoryAction {
}
message KeepInDefaultMemoryAction {
}
message MsaTensorOverride {
  oneof action {
    .xla.memory_space_assignment.PreferredPrefetchOverrideOptions prefetch = 3;
    .xla.memory_space_assignment.PinInAlternateMemoryAction pin_in_alternate_memory = 4;
    .xla.memory_space_assignment.KeepInDefaultMemoryAction keep_in_default_memory = 5;
  }
  optional .xla.memory_space_assignment.HloOperandFilter hlo_operand_filter = 1;
  optional .xla.memory_space_assignment.HloPositionMatcher hlo_position_matcher = 2;
}
message MsaTensorOverrides {
  repeated .xla.memory_space_assignment.MsaTensorOverride overrides = 1;
}
message ExpandedScopedAlternateMemoryMode {
  enum Value {
    UNDEFINED = 0;
    DISABLED = 1;
    ENABLED = 2;
  }
}
