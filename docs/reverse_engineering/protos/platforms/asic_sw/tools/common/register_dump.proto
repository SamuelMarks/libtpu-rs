syntax = "proto2";
package asic_sw.tools;
message DeviceRegister {
  optional int64 number = 1;
  optional int64 value = 2;
}
message InstructionTrace {
  optional int64 pc = 1;
  optional double timestamp = 2;
}
message CrashDump {
  repeated .asic_sw.tools.DeviceRegister reg = 1;
  repeated .asic_sw.tools.DeviceRegister scratchpad = 2;
  repeated .asic_sw.tools.InstructionTrace instruction = 3;
}
