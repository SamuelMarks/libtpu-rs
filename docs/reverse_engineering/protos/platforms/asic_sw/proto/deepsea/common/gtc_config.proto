syntax = "proto2";
package asic_sw.proto.deepsea;
enum GtcConfiguration {
  GTC_UNKNOWN = 0;
  GTC_GLOBAL_LEADER = 1;
  GTC_LOCAL_LEADER = 2;
  GTC_FOLLOWER = 3;
}
message GtcConfigurationData {
  repeated .asic_sw.proto.deepsea.GtcConfiguration link_configs = 1;
  optional int32 leader_port = 2;
  optional bool is_global_leader = 3;
}
