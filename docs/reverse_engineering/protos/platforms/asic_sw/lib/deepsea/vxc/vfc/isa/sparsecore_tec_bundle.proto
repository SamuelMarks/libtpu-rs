syntax = "proto2";
package asic_sw.deepsea.vxc.vfc.isa;
import "platforms/asic_sw/lib/deepsea/vxc/vfc/isa/sparsecore_immediates.proto";
import "platforms/asic_sw/lib/deepsea/vxc/vfc/isa/sparsecore_scalar_alu.proto";
import "platforms/asic_sw/lib/deepsea/vxc/vfc/isa/sparsecore_scalar_misc.proto";
import "platforms/asic_sw/lib/deepsea/vxc/vfc/isa/sparsecore_stream.proto";
import "platforms/asic_sw/lib/deepsea/vxc/vfc/isa/sparsecore_tec_dma.proto";
import "platforms/asic_sw/lib/deepsea/vxc/vfc/isa/sparsecore_tec_vector_alu.proto";
import "platforms/asic_sw/lib/deepsea/vxc/vfc/isa/sparsecore_tec_vector_extended.proto";
import "platforms/asic_sw/lib/deepsea/vxc/vfc/isa/sparsecore_tec_vector_load.proto";
import "platforms/asic_sw/lib/deepsea/vxc/vfc/isa/sparsecore_tec_vector_result.proto";
import "platforms/asic_sw/lib/deepsea/vxc/vfc/isa/sparsecore_tec_vector_store.proto";
import "platforms/asic_sw/lib/deepsea/vxc/vfc/isa/sparsecore_vector_scalar.proto";
message SparseCoreTecBundle {
  oneof scalar_instruction {
    .asic_sw.deepsea.vxc.vfc.isa.TecScalarSubBundle scalar_alu = 1;
    .asic_sw.deepsea.vxc.vfc.isa.SparseCoreTecDma dma = 2;
    .asic_sw.deepsea.vxc.vfc.isa.SparseCoreStream stream = 11;
  }
  optional .asic_sw.deepsea.vxc.vfc.isa.SparseCoreScalarMisc scalar_misc = 3;
  optional .asic_sw.deepsea.vxc.vfc.isa.SparseCoreTecVectorAlu vector_alu_0 = 4;
  optional .asic_sw.deepsea.vxc.vfc.isa.SparseCoreTecVectorAlu vector_alu_1 = 5;
  optional .asic_sw.deepsea.vxc.vfc.isa.SparseCoreTecVectorAlu vector_alu_2 = 6;
  optional .asic_sw.deepsea.vxc.vfc.isa.SparseCoreTecVectorLoad vector_load = 9;
  optional .asic_sw.deepsea.vxc.vfc.isa.SparseCoreTecVectorStore vector_store = 10;
  optional .asic_sw.deepsea.vxc.vfc.isa.SparseCoreTecVectorResult vector_result = 12;
  optional .asic_sw.deepsea.vxc.vfc.isa.SparseCoreTecVectorExtended vector_extended = 13;
  optional .asic_sw.deepsea.vxc.vfc.isa.SparseCoreVectorScalar vector_scalar = 7;
  optional .asic_sw.deepsea.vxc.vfc.isa.SparseCoreImmediates immediates = 8;
}
message TecScalarSubBundle {
  optional .asic_sw.deepsea.vxc.vfc.isa.SparseCoreScalarAlu scalar_alu_0 = 1;
  optional .asic_sw.deepsea.vxc.vfc.isa.SparseCoreScalarAlu scalar_alu_1 = 2;
}
