syntax = "proto2";
package asic_sw.deepsea.vxc.isa;
import "platforms/asic_sw/lib/deepsea/vxc/common/isa/tensorcore_dma.proto";
import "platforms/asic_sw/lib/deepsea/vxc/common/isa/tensorcore_immediates.proto";
