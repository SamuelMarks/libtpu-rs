  optional .asic_sw.deepsea.vxc.isa.TensorCoreVectorExtended vector_extended_1 = 6;
  optional .asic_sw.deepsea.vxc.isa.TensorCoreVectorResult vector_result_0 = 7;
  optional .asic_sw.deepsea.vxc.isa.TensorCoreVectorResult vector_result_1 = 8;
  optional .asic_sw.deepsea.vxc.isa.TensorCoreVectorLoad vector_load_0 = 11;
  optional .asic_sw.deepsea.vxc.isa.TensorCoreVectorLoad vector_load_1 = 12;
  optional .asic_sw.deepsea.vxc.isa.TensorCoreVectorLoad vector_load_2 = 13;
  optional .asic_sw.deepsea.vxc.isa.TensorCoreVectorStore vector_store = 14;
  optional .asic_sw.deepsea.vxc.isa.TensorCoreImmediates immediates = 15;
  optional .asic_sw.deepsea.vxc.isa.TensorCoreVectorScalar vector_scalar = 16;
