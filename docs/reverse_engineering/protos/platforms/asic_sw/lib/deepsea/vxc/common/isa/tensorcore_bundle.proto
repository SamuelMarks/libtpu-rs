    .asic_sw.deepsea.vxc.isa.TensorCoreDma dma = 10;
  }
  optional .asic_sw.deepsea.vxc.isa.TensorCoreVectorAlu vector_alu_0 = 1;
  optional .asic_sw.deepsea.vxc.isa.TensorCoreVectorAlu vector_alu_1 = 2;
  optional .asic_sw.deepsea.vxc.isa.TensorCoreVectorAlu vector_alu_2 = 3;
