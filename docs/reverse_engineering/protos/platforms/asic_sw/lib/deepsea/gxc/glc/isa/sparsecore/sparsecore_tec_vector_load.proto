syntax = "proto2";
package asic_sw.deepsea.gxc.glc.isa;
import "platforms/asic_sw/lib/deepsea/gxc/glc/isa/sparsecore/sparsecore_common_encodings.proto";
import "platforms/asic_sw/lib/deepsea/gxc/glc/isa/common_encodings.proto";
message SparseCoreTecVectorLoad {
  message TileSpmemLoad {
    optional uint32 dest = 1;
