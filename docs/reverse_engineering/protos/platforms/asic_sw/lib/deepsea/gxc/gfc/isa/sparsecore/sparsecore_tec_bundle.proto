  .asic_sw.deepsea.gxc.gfc.isa.SparseCoreImmediates immediates = 15;
  .asic_sw.deepsea.gxc.gfc.isa.SparseCoreTecVectorLoad vector_load = 16;
  .asic_sw.deepsea.gxc.gfc.isa.SparseCoreTecVectorStore vector_store = 17;
