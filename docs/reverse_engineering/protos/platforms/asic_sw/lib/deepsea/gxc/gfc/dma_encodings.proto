syntax = "proto2";
package asic_sw.deepsea.gxc.gfc;
enum DmaCoreId {
  DMA_CORE_ID_RESERVED_SELF = 0;
  DMA_CORE_ID_NON_CORE = 1;
  DMA_CORE_ID_TENSOR_CORE_0 = 2;
  DMA_CORE_ID_TENSOR_CORE_1 = 3;
  DMA_CORE_ID_SPARSE_CORE_0 = 4;
  DMA_CORE_ID_SPARSE_CORE_1 = 5;
  DMA_CORE_ID_SPARSE_CORE_2 = 6;
  DMA_CORE_ID_SPARSE_CORE_3 = 7;
}
enum DmaDestOpcode {
  DMA_DEST_OPCODE_WRITE = 0;
  DMA_DEST_OPCODE_WRITE_4B = 1;
  DMA_DEST_OPCODE_COMPARE_AND_SWAP = 2;
  DMA_DEST_OPCODE_READ_AND_ADD = 3;
}
enum DmaMemoryId {
  option allow_alias = true;
  DMA_MEMORY_ID_SELF_HBM = 0;
  DMA_MEMORY_ID_SPMEM = 0;
  DMA_MEMORY_ID_VMEM = 0;
  DMA_MEMORY_ID_HBM_0 = 1;
  DMA_MEMORY_ID_SMEM = 1;
  DMA_MEMORY_ID_HBM_1 = 2;
  DMA_MEMORY_ID_IMEM = 2;
  DMA_MEMORY_ID_SIMEM = 2;
  DMA_MEMORY_ID_HOST = 3;
  DMA_MEMORY_ID_TIMEM = 3;
}
enum DmaSourceOpcode {
  DMA_SOURCE_OPCODE_READ = 0;
  DMA_SOURCE_OPCODE_RESERVED = 1;
  DMA_SOURCE_OPCODE_INSTRUCTION_MEMSET = 2;
  DMA_SOURCE_OPCODE_DATA_MEMSET = 3;
}
enum DmaType {
  DMA_TYPE_LOCAL_OR_HOST = 0;
  DMA_TYPE_REMOTE_UNICAST = 1;
}
enum SyncMode {
  SYNC_MODE_32B_WORD = 0;
  SYNC_MODE_DESCRIPTOR = 1;
}
