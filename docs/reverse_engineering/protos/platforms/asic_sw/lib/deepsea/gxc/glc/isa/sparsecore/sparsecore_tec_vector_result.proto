    optional uint32 dest_two = 2;
    optional uint32 dest_vm = 3;
  }
  message PopXrfWritePartial4 {
    enum VresUnit {
      VRES_UNIT_XRF0 = 0;
      VRES_UNIT_XRF1 = 1;
    }
    optional .asic_sw.deepsea.gxc.glc.isa.SparseCoreTecVectorResult.PopXrfWritePartial4.VresUnit unit = 1;
    optional uint32 dest_one = 2;
    optional uint32 dest_two = 3;
  }
  message VresMove {
    optional uint32 dest_one = 1;
    optional .asic_sw.deepsea.gxc.glc.isa.SparsecoreVregReadPort port = 2;
