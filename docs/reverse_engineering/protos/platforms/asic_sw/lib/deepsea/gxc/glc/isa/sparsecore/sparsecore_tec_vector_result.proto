  message PopXrfWritePartial0 {
    enum VresUnit {
      VRES_UNIT_XRF0 = 0;
      VRES_UNIT_XRF1 = 1;
    }
    optional .asic_sw.deepsea.gxc.glc.isa.SparseCoreTecVectorResult.PopXrfWritePartial0.VresUnit unit = 1;
    optional uint32 dest_one = 2;
  }
  message PopXrfWritePartial1 {
    enum VresUnit {
      VRES_UNIT_XRF0 = 0;
      VRES_UNIT_XRF1 = 1;
    }
    optional .asic_sw.deepsea.gxc.glc.isa.SparseCoreTecVectorResult.PopXrfWritePartial1.VresUnit unit = 1;
    optional uint32 dest_one = 2;
    optional uint32 dest_vm = 3;
  }
  message PopXrfWritePartial2 {
    enum VresUnit {
      VRES_UNIT_XRF0 = 0;
      VRES_UNIT_XRF1 = 1;
    }
    optional .asic_sw.deepsea.gxc.glc.isa.SparseCoreTecVectorResult.PopXrfWritePartial2.VresUnit unit = 1;
    optional uint32 dest_two = 2;
