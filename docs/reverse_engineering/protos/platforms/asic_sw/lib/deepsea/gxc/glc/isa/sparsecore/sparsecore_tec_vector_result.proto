      VRES_UNIT_XRF1 = 1;
    }
    optional .asic_sw.deepsea.gxc.glc.isa.SparseCoreTecVectorResult.PopXrfWriteAll.VresUnit unit = 1;
    optional uint32 dest_one = 2;
    optional uint32 dest_two = 3;
    optional uint32 dest_vm = 4;
