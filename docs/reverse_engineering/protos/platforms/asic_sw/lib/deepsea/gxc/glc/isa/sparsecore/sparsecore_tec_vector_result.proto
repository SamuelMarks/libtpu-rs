    .asic_sw.deepsea.gxc.glc.isa.SparseCoreTecVectorResult.PopXrfWriteAll pop_xrf_write_all = 7;
    .asic_sw.deepsea.gxc.glc.isa.SparseCoreTecVectorResult.PopXrfWritePartial0 pop_xrf_write_partial_0 = 8;
    .asic_sw.deepsea.gxc.glc.isa.SparseCoreTecVectorResult.PopXrfWritePartial1 pop_xrf_write_partial_1 = 9;
    .asic_sw.deepsea.gxc.glc.isa.SparseCoreTecVectorResult.PopXrfWritePartial2 pop_xrf_write_partial_2 = 10;
    .asic_sw.deepsea.gxc.glc.isa.SparseCoreTecVectorResult.PopXrfWritePartial3 pop_xrf_write_partial_3 = 11;
    .asic_sw.deepsea.gxc.glc.isa.SparseCoreTecVectorResult.PopXrfWritePartial4 pop_xrf_write_partial_4 = 12;
    .asic_sw.deepsea.gxc.glc.isa.SparseCoreTecVectorResult.VresMove vres_move = 13;
