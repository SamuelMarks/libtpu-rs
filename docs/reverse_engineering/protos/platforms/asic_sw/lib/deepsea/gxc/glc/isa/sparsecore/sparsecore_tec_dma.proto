syntax = "proto2";
package asic_sw.deepsea.gxc.glc.isa;
import "platforms/asic_sw/lib/deepsea/common/isa/common_encodings.proto";
import "platforms/asic_sw/lib/deepsea/gxc/common/dma_encodings.proto";
import "platforms/asic_sw/lib/deepsea/gxc/glc/isa/common_encodings.proto";
message SparseCoreTecDma {
  message SimpleDma {
    optional uint32 dma_vreg_dest_offset = 1;
    optional uint32 dma_vreg_source_offset = 2;
    optional .asic_sw.deepsea.isa.ScalarY dest_sync_flags = 3;
    optional uint32 dma_sreg_source_offset = 4;
    optional .asic_sw.deepsea.isa.ScalarY dma_length = 5;
    optional bool thread_select = 6;
    optional bool trace_en = 7;
    optional .asic_sw.deepsea.gxc.DmaDestOpcode dst_opcode = 8;
    optional .asic_sw.deepsea.gxc.DmaCoreId dst_mem_core_id = 9;
    optional .asic_sw.deepsea.gxc.DmaMemoryId dst_mem_mem_id = 10;
    optional .asic_sw.deepsea.gxc.SyncMode sync_mode = 11;
    optional bool relaxed_ordering_or_thread_select_1 = 12;
    optional .asic_sw.deepsea.gxc.DmaCoreId src_mem_core_id = 13;
    optional .asic_sw.deepsea.gxc.DmaMemoryId src_mem_mem_id = 14;
    optional uint32 dma_sreg_dest_offset = 15;
    optional bool source_in_vreg = 16;
    optional bool dest_in_vreg = 17;
    optional bool upper_host_addr_valid = 18 [default = true];
    optional uint32 upper_host_addr = 19;
  }
  message SingleStridedDma {
    optional uint32 dma_sreg_source_offset = 1;
    optional .asic_sw.deepsea.isa.ScalarY dma_length = 2;
    optional bool thread_select = 3;
    optional bool trace_en = 4;
    optional .asic_sw.deepsea.gxc.DmaDestOpcode dst_opcode = 5;
    optional .asic_sw.deepsea.gxc.DmaCoreId dst_mem_core_id = 6;
    optional .asic_sw.deepsea.gxc.DmaMemoryId dst_mem_mem_id = 7;
    optional .asic_sw.deepsea.gxc.SyncMode sync_mode = 8;
    optional bool relaxed_ordering_or_thread_select_1 = 9;
    optional .asic_sw.deepsea.gxc.DmaCoreId src_mem_core_id = 10;
    optional .asic_sw.deepsea.gxc.DmaMemoryId src_mem_mem_id = 11;
    optional uint32 dma_sreg_dest_offset = 12;
    optional .asic_sw.deepsea.isa.ScalarY dest_sync_flags = 13;
    optional uint32 inner_vector_length = 14;
    optional bool source_stride_valid = 15 [default = true];
    optional uint32 source_stride = 16;
    optional bool destination_stride_valid = 17 [default = true];
    optional uint32 destination_stride = 18;
    optional bool elements_per_stride_valid = 19 [default = true];
    optional uint32 elements_per_stride = 20;
    optional bool upper_host_addr_valid = 21 [default = true];
    optional uint32 upper_host_addr = 22;
  }
  message GeneralDma {
    optional uint32 dma_vreg_dest_offset = 1;
    optional uint32 dma_vreg_source_offset = 2;
    optional uint32 dma_sreg_source_offset = 3;
    optional .asic_sw.deepsea.isa.ScalarY dma_length = 4;
    optional bool thread_select = 5;
    optional bool trace_en = 6;
    optional .asic_sw.deepsea.gxc.DmaDestOpcode dst_opcode = 7;
    optional .asic_sw.deepsea.gxc.DmaCoreId dst_mem_core_id = 8;
    optional .asic_sw.deepsea.gxc.DmaMemoryId dst_mem_mem_id = 9;
    optional .asic_sw.deepsea.gxc.SyncMode sync_mode = 10;
    optional bool relaxed_ordering_or_thread_select_1 = 11;
    optional .asic_sw.deepsea.gxc.DmaCoreId src_mem_core_id = 12;
    optional .asic_sw.deepsea.gxc.DmaMemoryId src_mem_mem_id = 13;
    optional uint32 dma_sreg_dest_offset = 14;
    optional bool source_in_vreg = 15;
    optional bool dest_in_vreg = 16;
    optional uint32 nondefault_stride_dimensions = 17;
    optional bool source_sync_flag_number_valid = 18 [default = true];
    optional uint32 source_sync_flag_number = 19;
    optional bool dest_sync_flags_valid = 20 [default = true];
    optional uint32 dest_sync_flags_vs1 = 21;
    optional bool destination_id_valid = 22 [default = true];
    optional uint32 destination_id = 23;
    optional bool upper_host_addr_valid = 24 [default = true];
    optional uint32 upper_host_addr = 25;
  }
  oneof inst {
    .asic_sw.deepsea.gxc.glc.isa.SparseCoreTecDma.SimpleDma simple_dma = 6;
    .asic_sw.deepsea.gxc.glc.isa.SparseCoreTecDma.SingleStridedDma single_strided_dma = 7;
    .asic_sw.deepsea.gxc.glc.isa.SparseCoreTecDma.GeneralDma general_dma = 8;
  }
  optional .asic_sw.deepsea.gxc.glc.isa.Predication predication = 1 [default = PREDICATION_ALWAYS];
  optional bool predication_inversion = 2;
  optional uint32 latency = 3 [default = 1];
  map<string, uint32> resource_usage = 4;
  optional uint32 bit_width = 5;
}
