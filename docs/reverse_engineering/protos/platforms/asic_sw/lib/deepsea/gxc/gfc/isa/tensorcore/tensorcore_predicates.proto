  optional bool pred_0_inversion = 2 [default = false];
  optional .asic_sw.deepsea.gxc.gfc.isa.PredicationSlot pred_1 = 3 [default = PREDICATION_SLOT_PREG0_IS_1];
  optional bool pred_1_inversion = 4 [default = false];
  optional uint32 latency = 5;
  map<string, uint32> resource_usage = 6;
  optional uint32 bit_width = 7;
}
