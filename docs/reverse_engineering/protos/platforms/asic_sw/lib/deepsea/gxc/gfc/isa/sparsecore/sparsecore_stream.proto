syntax = "proto2";
package asic_sw.deepsea.gxc.gfc.isa;
import "platforms/asic_sw/lib/deepsea/gxc/gfc/isa/sparsecore/sparsecore_common_encodings.proto";
import "platforms/asic_sw/lib/deepsea/common/isa/common_encodings.proto";
enum IndirectFilterMode {
  INDIRECT_FILTER_MODE_SKIP = 0;
  INDIRECT_FILTER_MODE_COMPACT = 1;
}
enum IndirectLengthType {
  INDIRECT_LENGTH_TYPE_FIXED = 0;
  INDIRECT_LENGTH_TYPE_VARIABLE = 1;
}
enum IndirectListType {
  INDIRECT_LIST_TYPE_WORD_OFFSET = 0;
  INDIRECT_LIST_TYPE_ROW_OFFSET = 1;
}
enum IndirectOffsetSource {
  INDIRECT_OFFSET_SOURCE_SREG = 0;
  INDIRECT_OFFSET_SOURCE_CBREG = 1;
}
enum OffTileMemoryType {
  OFF_TILE_MEMORY_TYPE_SPMEM = 0;
  OFF_TILE_MEMORY_TYPE_TILE_SPMEM_N = 1;
  OFF_TILE_MEMORY_TYPE_HBM = 2;
  OFF_TILE_MEMORY_TYPE_HBM_4B = 3;
  OFF_TILE_MEMORY_TYPE_RESERVED_0 = 4;
  OFF_TILE_MEMORY_TYPE_RESERVED_1 = 5;
  OFF_TILE_MEMORY_TYPE_RESERVED_2 = 6;
  OFF_TILE_MEMORY_TYPE_RESERVED_3 = 7;
}
enum StreamOpcode {
  STREAM_OPCODE_GATHER = 0;
  STREAM_OPCODE_GATHER_INTEGER_ADD = 1;
  STREAM_OPCODE_GATHER_FLOAT_ADD = 2;
  STREAM_OPCODE_RESERVED_0 = 3;
  STREAM_OPCODE_SCATTER = 4;
  STREAM_OPCODE_SCATTER_INTEGER_ADD = 5;
  STREAM_OPCODE_SCATTER_FLOAT_ADD = 6;
  STREAM_OPCODE_RESERVED_1 = 7;
}
enum SyncFlagCountType {
  SYNC_FLAG_COUNT_TYPE_WORD_4B = 0;
  SYNC_FLAG_COUNT_TYPE_DESCRIPTOR = 1;
