    .asic_sw.deepsea.gxc.gfc.isa.SparseCoreStream.IndirectStream indirect_stream = 10;
    .asic_sw.deepsea.gxc.gfc.isa.SparseCoreStream.IndirectVregStream indirect_vreg_stream = 11;
