    optional .asic_sw.deepsea.gxc.gfc.isa.TileLocalStreamType tile_local_stream_type = 21;
    optional .asic_sw.deepsea.gxc.gfc.isa.OffTileMemoryType off_tile_memory_type = 22;
    optional uint32 s0_x = 23;
    optional .asic_sw.deepsea.isa.ScalarY s0_y = 24;
    optional uint32 s1_x = 25;
    optional .asic_sw.deepsea.isa.ScalarY s1_y = 26;
