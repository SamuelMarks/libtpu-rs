  optional .asic_sw.deepsea.gxc.gfc.isa.SparsecoreNormalPredication normal_predication = 1 [default = SPARSECORE_NORMAL_PREDICATION_ALWAYS];
  optional bool normal_predication_inversion = 2;
  optional .asic_sw.deepsea.gxc.gfc.isa.SparsecoreRotatePredication rotate_predication = 3 [default = SPARSECORE_ROTATE_PREDICATION_PREG7_IS_1];
  optional bool is_rotate_predication = 4;
  optional uint32 latency = 5 [default = 1];
  map<string, uint32> resource_usage = 6;
  optional uint32 bit_width = 7;
}
