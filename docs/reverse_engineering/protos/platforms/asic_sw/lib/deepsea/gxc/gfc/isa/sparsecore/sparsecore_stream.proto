    optional bool post_update_circular_buffer = 8;
    optional .asic_sw.deepsea.gxc.gfc.isa.IndirectListType indirect_list_type = 9;
    optional uint32 indirect_list_stride = 10;
    optional bool indirect_filter_en = 11;
    optional .asic_sw.deepsea.gxc.gfc.isa.IndirectFilterMode indirect_filter_mode = 12;
    optional .asic_sw.deepsea.gxc.gfc.isa.IndirectLengthType indirect_length_type = 13;
    optional .asic_sw.deepsea.gxc.gfc.isa.IndirectOffsetSource indirect_offset_source = 14;
    optional bool post_update_indirect_offset_circular_buffer = 15;
    optional bool trace_en = 16;
    optional uint32 indirect_mask = 17;
    optional .asic_sw.deepsea.gxc.gfc.isa.StreamOpcode stream_opcode = 18;
    optional bool gather_scatter_add_is_b16 = 19 [default = false];
    optional .asic_sw.deepsea.gxc.gfc.isa.TileLocalMemoryType tile_local_memory_type = 20;
    optional .asic_sw.deepsea.gxc.gfc.isa.TileLocalStreamType tile_local_stream_type = 21;
    optional .asic_sw.deepsea.gxc.gfc.isa.OffTileMemoryType off_tile_memory_type = 22;
    optional uint32 s0_x = 23;
    optional .asic_sw.deepsea.isa.ScalarY s0_y = 24;
    optional uint32 s1_x = 25;
    optional .asic_sw.deepsea.isa.ScalarY s1_y = 26;
  }
  message IndirectVregStream {
    optional uint32 indirect_offsets = 1;
    optional uint32 indirect_access_lengths = 2;
    optional bool off_tile_start_offset_valid = 3 [default = true];
    optional uint32 off_tile_start_offset = 4;
    optional .asic_sw.deepsea.gxc.gfc.isa.SyncFlagCountType sync_flag_count_type = 5;
    optional bool set_done_bit = 6;
    optional .asic_sw.deepsea.gxc.gfc.isa.TileLocalStride tile_local_stride = 7;
    optional bool post_update_circular_buffer = 8;
    optional .asic_sw.deepsea.gxc.gfc.isa.IndirectListType indirect_list_type = 9;
    optional uint32 indirect_list_stride = 10;
    optional bool indirect_filter_en = 11;
    optional .asic_sw.deepsea.gxc.gfc.isa.IndirectFilterMode indirect_filter_mode = 12;
    optional .asic_sw.deepsea.gxc.gfc.isa.IndirectLengthType indirect_length_type = 13;
    optional .asic_sw.deepsea.gxc.gfc.isa.IndirectOffsetSource indirect_offset_source = 14;
    optional bool post_update_indirect_offset_circular_buffer = 15;
    optional bool trace_en = 16;
    optional uint32 indirect_mask = 17;
    optional .asic_sw.deepsea.gxc.gfc.isa.StreamOpcode stream_opcode = 18;
