  optional int32 vreg = 1;
  optional bytes before_bytes = 2;
  optional bytes after_bytes = 3;
  repeated float before_floats = 4;
  repeated float after_floats = 5;
  repeated uint32 before_u32s = 7;
  repeated uint32 after_u32s = 8;
