  optional int32 preg = 1;
  optional bool before = 2;
  optional bool after = 3;
}
message LocalMemoryStateChange {
  optional int64 address = 1;
  optional bytes before_bytes = 2;
  optional bytes after_bytes = 3;
  repeated float before_floats = 4;
  repeated float after_floats = 5;
}
