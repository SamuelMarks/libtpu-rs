syntax = "proto3";

package tpu;

import "emitter_learned_cost_model_options.proto";
import "memory_scheduler.proto";
import "memory_space_assignment.proto";

message TpuCompilationEnvironmentProto {
  bool xla_tpu_enable_megacore_fusion = 1;
  bool xla_tpu_enable_async_collective_fusion = 2;
  int64 xla_tpu_scoped_vmem_limit_kib = 3;
  string custom_flags = 4;
  bool xla_tpu_enable_latency_hiding_scheduler = 5;
  bool xla_tpu_overlap_compute_collective_tc = 6;
  bool xla_tpu_use_tc_device_shape_on_sc = 7;
  bool xla_tpu_enable_flash_attention = 8;
  bool xla_tpu_spmd_rng_bit_generator_unsafe = 9;
  xla.jellyfish.MemorySpaceAssignmentOptions memory_space_assignment_options = 10;
  xla.MemorySchedulerProto memory_scheduler_options = 11;
  xla.jellyfish.EmitterLearnedCostModelOptions learned_cost_model_options = 12;
}
