  bool xla_tpu_enable_ag_backward_pipelining = 28;
  int32 xla_tpu_sparse_core_max_ids_per_partition = 29;
  int32 xla_tpu_sparse_core_max_unique_ids_per_partition = 30;
  bool xla_tpu_enable_megascale_pjrt_collectives = 31;
  bool xla_tpu_enable_ici_compression = 32;
  int64 xla_tpu_cmem_limit_kib = 33;
