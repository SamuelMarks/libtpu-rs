syntax = "proto3";

package asic_sw.driver;

message VfioIommuMapConfigProto {
  string vfio_group_path = 1;
  uint32 iommu_type = 2;
  uint64 iova_aperture_base = 3;
  uint64 iova_aperture_size = 4;
  uint64 hugepage_granularity_bytes = 5;
}
