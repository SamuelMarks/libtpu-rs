syntax = "proto3";
package xla.megascale.runtime;
message HostNetworkAddress {
  string address = 1;
  string interface_name = 2;
  int32 numa_node = 4;
  string host_name_for_debugging = 3;
}
message NetworkAddressMapping {
  int32 slice_id = 1;
  int32 host_id = 2;
  repeated .xla.megascale.runtime.HostNetworkAddress addresses = 3;
  optional uint64 incarnation_id = 4;
}
message EndpointAddresses {
  repeated .xla.megascale.runtime.NetworkAddressMapping address_mappings = 1;
}
