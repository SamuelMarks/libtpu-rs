syntax = "proto3";
package xla;
enum PrimitiveType {
  PRIMITIVE_TYPE_INVALID = 0;
  PRED = 1;
  S1 = 30;
  S2 = 26;
  S4 = 21;
  S8 = 2;
  S16 = 3;
  S32 = 4;
  S64 = 5;
  U1 = 31;
  U2 = 27;
  U4 = 22;
  U8 = 6;
  U16 = 7;
  U32 = 8;
  U64 = 9;
  F16 = 10;
  F32 = 11;
  BF16 = 16;
  F64 = 12;
  F8E5M2 = 19;
  F8E4M3 = 28;
  F8E4M3FN = 20;
  F8E4M3B11FNUZ = 23;
  F8E3M4 = 29;
  F8E5M2FNUZ = 24;
  F8E4M3FNUZ = 25;
  F4E2M1FN = 32;
  F8E8M0FNU = 33;
  F6E3M2FN = 35;
  F6E2M3FN = 36;
  C64 = 15;
  C128 = 18;
  TUPLE = 13;
  OPAQUE_TYPE = 14;
  TOKEN = 17;
  BUFFER = 34;
}
enum CollectiveOpGroupMode {
  COLLECTIVE_OP_GROUP_MODE_CROSS_REPLICA = 0;
  COLLECTIVE_OP_GROUP_MODE_CROSS_PARTITION = 1;
  COLLECTIVE_OP_GROUP_MODE_CROSS_REPLICA_AND_PARTITION = 2;
  COLLECTIVE_OP_GROUP_MODE_FLATTENED_ID = 3;
}
enum DimLevelType {
  DIM_DENSE = 0;
  DIM_COMPRESSED = 1;
  DIM_SINGLETON = 2;
  DIM_LOOSE_COMPRESSED = 3;
}
enum ProfileType {
  INVALID = 0;
  WINDOW = 1;
  FLAG = 2;
  INTEGER = 3;
}
enum ProfileSource {
  PROFILE_SOURCE_UNKNOWN_SOURCE = 0;
  PROFILE_SOURCE_EMBEDDED = 1;
  PROFILE_SOURCE_REMOTE = 2;
}
enum CompilationEvent {
  COMPILATION_EVENT_UNKNOWN_EVENT = 0;
  COMPILATION_EVENT_FIRST_COMPILATION = 1;
  COMPILATION_EVENT_RECOMPILATION = 2;
}
enum ProfileGenerationStrategy {
  PROFILE_GENERATION_STRATEGY_UNKNOWN = 0;
  PROFILE_GENERATION_STRATEGY_GA = 1;
  PROFILE_GENERATION_STRATEGY_FANTA = 2;
  PROFILE_GENERATION_STRATEGY_CFO = 3;
  PROFILE_GENERATION_STRATEGY_EXHAUSTIVE = 4;
  PROFILE_GENERATION_STRATEGY_LCM_GNN = 5;
  PROFILE_GENERATION_STRATEGY_LCM_MOE = 6;
}
enum PaddingType {
  PADDING_INVALID = 0;
  PADDING_VALID = 1;
  PADDING_SAME = 2;
}
enum FftType {
  FFT = 0;
  IFFT = 1;
  RFFT = 2;
  IRFFT = 3;
}
enum RandomDistribution {
  RNG_INVALID = 0;
  RNG_UNIFORM = 1;
  RNG_NORMAL = 2;
}
enum RandomAlgorithm {
  RNG_DEFAULT = 0;
  RNG_THREE_FRY = 1;
  RNG_PHILOX = 2;
}
message PaddingConfig {
  message PaddingConfigDimension {
    int64 edge_padding_low = 1;
    int64 edge_padding_high = 2;
    int64 interior_padding = 3;
  }
  repeated .xla.PaddingConfig.PaddingConfigDimension dimensions = 1;
}
message TileProto {
  repeated int64 dimensions = 1;
}
message SplitConfigProto {
  int64 dimension = 1;
  repeated int64 split_indices = 2;
}
message LayoutProto {
  reserved 2;
  reserved 3;
  reserved 4;
  reserved 5;
  reserved "padded_dimensions";
  reserved "padding_value";
  reserved "format";
  reserved "max_sparse_elements";
  repeated int64 minor_to_major = 1;
  repeated .xla.DimLevelType dim_level_types = 9;
  repeated bool dim_unique = 13;
  repeated bool dim_ordered = 14;
  repeated .xla.TileProto tiles = 6;
  int64 tail_padding_alignment_in_elements = 16;
  int64 element_size_in_bits = 7;
  int64 memory_space = 8;
  .xla.PrimitiveType index_primitive_type = 11;
  .xla.PrimitiveType pointer_primitive_type = 12;
  .xla.ShapeProto physical_shape = 10;
  int64 dynamic_shape_metadata_prefix_bytes = 15;
  repeated .xla.SplitConfigProto split_configs = 17;
}
message ShapeProto {
  reserved 1;
  reserved "rank";
  .xla.PrimitiveType element_type = 2;
  repeated int64 dimensions = 3;
  repeated bool is_dynamic_dimension = 6;
  repeated .xla.ShapeProto tuple_shapes = 4;
  .xla.LayoutProto layout = 5;
}
message ProgramShapeProto {
  repeated .xla.ShapeProto parameters = 1;
  .xla.ShapeProto result = 2;
  repeated string parameter_names = 3;
}
message ComputationStats {
  double flop_count = 1;
  double transcendental_count = 2;
}
message Payload {
  oneof payload_source {
    bytes value = 1;
    int64 id = 2;
  }
}
message OpMetadata {
  reserved 6;
  reserved 7;
  reserved 11;
  reserved 13;
  reserved 14;
  reserved "creation_pass_id";
  reserved "logical_creation_pass_id";
  message ProfileInfo {
    repeated .xla.ProfileType profile_type = 1;
    double relative_speedup = 2;
    .xla.ProfileSource profile_source = 3;
    .xla.CompilationEvent compilation_event = 4;
    .xla.ProfileGenerationStrategy profile_generation_strategy = 5;
  }
  string op_type = 1;
  string op_name = 2;
  string source_file = 3;
  int32 source_line = 4;
  int32 source_end_line = 17;
  int32 source_column = 18;
  int32 source_end_column = 19;
  repeated .xla.ProfileType profile_type = 5;
  int64 size_of_generated_code_in_bytes = 8;
  int64 size_of_memory_working_set_in_bytes = 9;
  .xla.OpMetadata.ProfileInfo profile_info = 10;
  string deduplicated_name = 12;
  int32 stack_frame_id = 15;
  string scheduling_name = 16;
  .xla.Payload metadata_payload = 20;
}
message ExecutionProfile {
  bool compilation_cache_hit = 1;
  int64 compile_time_ms = 2;
  int64 compute_cycle_count = 3;
  int64 compute_time_ns = 4;
  int64 compute_and_transfer_time_ns = 5;
  int64 executable_size_in_bytes = 6;
  bool profile_cache_hit = 7;
  bool warmup_run_executed = 8;
}
message ExecutionHandle {
  int64 handle = 1;
}
message GlobalDataHandle {
  int64 handle = 1;
}
message DeviceHandle {
  int64 handle = 1;
  int64 device_count = 2;
}
message ChannelHandle {
  enum ChannelType {
    CHANNEL_TYPE_INVALID = 0;
    DEVICE_TO_DEVICE = 1;
    DEVICE_TO_HOST = 2;
    HOST_TO_DEVICE = 3;
  }
  int64 handle = 1;
  .xla.ChannelHandle.ChannelType type = 2;
}
message DeviceAssignmentProto {
  message ComputationDevice {
    repeated int64 replica_device_ids = 1;
  }
  int32 replica_count = 1;
  int32 computation_count = 2;
  repeated .xla.DeviceAssignmentProto.ComputationDevice computation_devices = 3;
}
message LiteralProto {
  .xla.ShapeProto shape = 1;
  repeated bool preds = 2;
  bytes s1s = 30;
  bytes s2s = 26;
  bytes s4s = 21;
  bytes s8s = 15;
  bytes u1s = 31;
  bytes u2s = 27;
  bytes u4s = 22;
  bytes u8s = 3;
  repeated int32 s32s = 4;
  repeated int64 s64s = 5;
  repeated uint32 u32s = 6;
  repeated uint64 u64s = 7;
  repeated float f32s = 8;
  repeated double f64s = 9;
  repeated float c64s = 12;
  repeated double c128s = 18;
  repeated .xla.LiteralProto tuple_literals = 10;
  bytes f16s = 11;
  bytes bf16s = 13;
  bytes u16s = 16;
  bytes s16s = 17;
  bytes f4e2m1fns = 32;
  bytes f8e3m4s = 29;
  bytes f8e4m3b11fnuzs = 23;
  bytes f8e4m3fns = 20;
  bytes f8e4m3fnuzs = 25;
  bytes f8e4m3s = 28;
  bytes f8e5m2fnuzs = 24;
  bytes f8e5m2s = 19;
  bytes f8e8m0fnus = 33;
  bytes f6e3m2fns = 35;
  bytes f6e2m3fns = 36;
  repeated int64 sparse_indices = 14;
  repeated int32 dynamic_sizes = 34;
}
message WindowDimension {
  int64 size = 1;
  int64 stride = 2;
  int64 padding_low = 3;
  int64 padding_high = 4;
  int64 window_dilation = 5;
  int64 base_dilation = 6;
  bool window_reversal = 7;
}
message Window {
  repeated .xla.WindowDimension dimensions = 1;
}
message GatherDimensionNumbers {
  repeated int64 offset_dims = 1;
  repeated int64 collapsed_slice_dims = 2;
  repeated int64 start_index_map = 3;
  int64 index_vector_dim = 4;
  repeated int64 operand_batching_dims = 5;
  repeated int64 start_indices_batching_dims = 6;
}
message ScatterDimensionNumbers {
  repeated int64 update_window_dims = 1;
  repeated int64 inserted_window_dims = 2;
  repeated int64 scatter_dims_to_operand_dims = 3;
  int64 index_vector_dim = 4;
  repeated int64 input_batching_dims = 5;
  repeated int64 scatter_indices_batching_dims = 6;
}
message ConvolutionDimensionNumbers {
  int64 input_batch_dimension = 7;
  int64 input_feature_dimension = 8;
  repeated int64 input_spatial_dimensions = 11;
  int64 kernel_input_feature_dimension = 3;
  int64 kernel_output_feature_dimension = 4;
  repeated int64 kernel_spatial_dimensions = 6;
  int64 output_batch_dimension = 9;
  int64 output_feature_dimension = 10;
  repeated int64 output_spatial_dimensions = 12;
}
message SparsityConfig {
  message TensorSparsityConfig {
    int64 num_non_zero = 1;
    int64 block_size = 2;
    int64 dimension = 3;
    int64 stride = 4;
    int32 idx = 5;
  }
  .xla.SparsityConfig.TensorSparsityConfig lhs = 1;
  .xla.SparsityConfig.TensorSparsityConfig rhs = 2;
}
message BlockScalingConfig {
  message TensorBlockScalingConfig {
    int32 scale_idx = 1;
    optional int32 zero_idx = 2;
    repeated int64 strides = 3;
    repeated int64 steps = 4;
    repeated int64 block_sizes = 5;
  }
  .xla.BlockScalingConfig.TensorBlockScalingConfig lhs = 1;
  .xla.BlockScalingConfig.TensorBlockScalingConfig rhs = 2;
}
message DotDimensionNumbers {
  repeated int64 lhs_contracting_dimensions = 1;
  repeated int64 rhs_contracting_dimensions = 2;
  repeated int64 lhs_batch_dimensions = 3;
  repeated int64 rhs_batch_dimensions = 4;
}
message RaggedDotDimensionNumbers {
  .xla.DotDimensionNumbers dot_dimension_numbers = 1;
  repeated int64 lhs_ragged_dimensions = 2;
  repeated int64 rhs_group_dimensions = 3;
}
message ShuffleMode {
  message Rotate {
    repeated int64 shifts = 1;
  }
  oneof mode {
    .xla.ShuffleMode.Rotate rotate = 1;
  }
}
message TriangularSolveOptions {
  enum Transpose {
    TRANSPOSE_INVALID = 0;
    NO_TRANSPOSE = 1;
    TRANSPOSE = 2;
    ADJOINT = 3;
  }
  bool left_side = 1;
  bool lower = 2;
  bool unit_diagonal = 3;
  .xla.TriangularSolveOptions.Transpose transpose_a = 4;
}
message CholeskyOptions {
  bool lower = 1;
}
message CubScanOptions {
  enum Kind {
    KIND_INVALID = 0;
    SUM = 1;
  }
  int64 vector_length = 1;
  int64 row_length = 2;
  int64 column_length = 3;
  .xla.CubScanOptions.Kind kind = 4;
  bool is_reverse = 5;
}
message SortOptions {
  bool descending = 1;
}
message FrontendAttributes {
  map<string, string> map = 1;
}
message Statistic {
  string stat_name = 1;
  double stat_val = 2;
}
message StatisticsViz {
  int64 stat_index_to_visualize = 1;
  repeated .xla.Statistic statistics = 2;
}
message MeshProto {
  message MeshAxis {
    string name = 1;
    int64 size = 2;
  }
  message IotaTransform {
    repeated int64 reshape_dims = 1;
    repeated int64 transpose_perm = 2;
  }
  repeated .xla.MeshProto.MeshAxis axes = 1;
  repeated int64 device_ids = 2;
  optional .xla.MeshProto.IotaTransform iota_transform = 3;
}
message AxisRefProto {
  message SubAxis {
    int64 pre_size = 1;
    int64 size = 2;
  }
  int64 mesh_axis_index = 1;
  optional .xla.AxisRefProto.SubAxis sub_axis_info = 2;
}
message NamedShardingProto {
  reserved 1;
  enum ReductionOpProto {
    SUM = 0;
    MAX = 1;
    MIN = 2;
  }
  message DimensionSharding {
    repeated .xla.AxisRefProto axes = 1;
    bool is_closed = 2;
  }
  .xla.MeshProto mesh = 2;
  repeated .xla.NamedShardingProto.DimensionSharding dim_shardings = 3;
  repeated .xla.AxisRefProto replicated_axes = 4;
  repeated .xla.AxisRefProto unreduced_axes = 5;
  .xla.NamedShardingProto.ReductionOpProto reduction_op = 8;
  repeated .xla.AxisRefProto manual_axes = 7;
  repeated .xla.OpMetadata metadata = 6;
}
message OpSharding {
  enum Type {
    REPLICATED = 0;
    MAXIMAL = 1;
    TUPLE = 2;
    OTHER = 3;
    MANUAL = 4;
    UNKNOWN = 5;
    UNREDUCED = 6;
  }
  enum ShardGroupType {
    AS = 0;
    LIKE = 1;
  }
  .xla.OpSharding.Type type = 1;
  .xla.ShapeProto tile_shape = 2;
  repeated int64 tile_assignment_dimensions = 3;
  repeated int64 tile_assignment_devices = 4;
  repeated .xla.OpSharding tuple_shardings = 5;
  bool replicate_on_last_tile_dim = 6;
  repeated .xla.OpMetadata metadata = 7;
  repeated .xla.OpSharding.Type last_tile_dims = 8;
  repeated int64 iota_reshape_dims = 9;
  repeated int32 iota_transpose_perm = 10;
  bool is_shard_group = 11;
  int64 shard_group_id = 12;
  .xla.OpSharding.ShardGroupType shard_group_type = 13;
  optional .xla.NamedShardingProto named_sharding = 14;
}
message ReplicaGroup {
  repeated int64 replica_ids = 1;
}
message MeshAxesReplicaGroupListProto {
  .xla.MeshProto mesh = 1;
  repeated .xla.AxisRefProto axes = 2;
}
message IotaReplicaGroupListProto {
  int64 num_replica_groups = 1;
  int64 num_devices_per_group = 2;
  repeated int64 iota_reshape_dims = 3;
  repeated int32 iota_transpose_perm = 4;
}
message CollectiveDeviceListProto {
  reserved 2;
  reserved "iota_replica_group_list";
  repeated .xla.ReplicaGroup replica_groups = 1;
}
message SourceTarget {
  int64 source = 1;
  int64 target = 2;
}
message ResultAccuracy {
  enum Mode {
    DEFAULT = 0;
    HIGHEST = 1;
  }
  message Tolerance {
    double atol = 1;
    double rtol = 2;
    int64 ulps = 3;
  }
  oneof specs {
    .xla.ResultAccuracy.Mode mode = 1;
    .xla.ResultAccuracy.Tolerance tolerance = 2;
  }
}
message PrecisionConfig {
  enum Precision {
    DEFAULT = 0;
    HIGH = 1;
    HIGHEST = 2;
  }
  enum Algorithm {
    ALG_UNSET = 0;
    ALG_DOT_ANY_F8_ANY_F8_F32 = 1;
    ALG_DOT_ANY_F8_ANY_F8_F32_FAST_ACCUM = 2;
    ALG_DOT_F16_F16_F16 = 3;
    ALG_DOT_F16_F16_F32 = 4;
    ALG_DOT_BF16_BF16_BF16 = 5;
    ALG_DOT_BF16_BF16_F32 = 6;
    ALG_DOT_BF16_BF16_F32_X3 = 7;
    ALG_DOT_BF16_BF16_F32_X6 = 8;
    ALG_DOT_TF32_TF32_F32 = 9;
    ALG_DOT_TF32_TF32_F32_X3 = 10;
    ALG_DOT_F32_F32_F32 = 11;
    ALG_DOT_F64_F64_F64 = 12;
    ALG_DOT_BF16_BF16_F32_X9 = 13;
    ALG_DOT_BF16_BF16_FP8X3 = 14;
    ALG_DOT_BF16_BF16_FP8X4 = 15;
  }
  repeated .xla.PrecisionConfig.Precision operand_precision = 1;
  .xla.PrecisionConfig.Algorithm algorithm = 2;
}
message ParameterReplication {
  repeated bool replicated_at_leaf_buffers = 1;
}
message WhileLoopBackendConfig {
  reserved 4;
  reserved "dynamic_variable_tuple_indices";
  message KnownInitStep {
    int64 init = 1;
    int64 step = 2;
  }
  message KnownTripCount {
    int64 n = 1;
  }
  message KnownInductionVariable {
    int64 tuple_index = 1;
  }
  message DynamicVariable {
    int64 tuple_index = 1;
    optional int64 init = 2;
    optional int64 step = 3;
  }
  .xla.WhileLoopBackendConfig.KnownTripCount known_trip_count = 1;
  .xla.WhileLoopBackendConfig.KnownInitStep known_init_step = 2;
  .xla.WhileLoopBackendConfig.KnownInductionVariable known_induction_variable = 3;
  repeated .xla.WhileLoopBackendConfig.DynamicVariable dynamic_variables = 5;
}
message OutputOperandAliasing {
  repeated int64 output_shape_index = 1;
  int64 operand_index = 2;
  repeated int64 operand_shape_index = 3;
}
message OriginalArrayProto {
  string instruction_name = 1;
  repeated int64 shape_index = 2;
}
message OriginalValueElementProto {
  repeated int64 shape_index = 1;
  .xla.OriginalArrayProto original_array = 2;
}
message OriginalValueProto {
  repeated .xla.OriginalValueElementProto elements = 1;
  bool is_synthetic_call = 2;
  optional string call_hierarchy = 3;
}
message GemmPerfTableEntry {
  int64 b = 1;
  int64 m = 2;
  int64 n = 3;
  int64 k = 4;
  map<string, int64> flops = 5;
}
message GemmPerfTableEntryValues {
  repeated .xla.GemmPerfTableEntry entries = 1;
}
message GemmPerfTable {
  map<string, .xla.GemmPerfTableEntryValues> entries = 1;
}
