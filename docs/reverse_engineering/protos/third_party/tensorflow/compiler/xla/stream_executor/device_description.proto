syntax = "proto3";
package stream_executor;
import "third_party/tensorflow/compiler/xla/autotune_results.proto";
import "third_party/tensorflow/compiler/xla/stream_executor/cuda/cuda_compute_capability.proto";
import "third_party/tensorflow/compiler/xla/stream_executor/sycl/oneapi_compute_capability.proto";
message RocmComputeCapabilityProto {
  string gcn_arch_name = 1;
}
message GpuComputeCapabilityProto {
  oneof compute_capability {
    .stream_executor.CudaComputeCapabilityProto cuda_compute_capability = 1;
    .stream_executor.RocmComputeCapabilityProto rocm_compute_capability = 2;
    .stream_executor.OneAPIComputeCapabilityProto oneapi_compute_capability = 3;
  }
}
message ExecutionUnitDescriptionProto {
  message RateInfoProto {
    float clock_rate_ghz = 1;
    int32 units_per_core = 2;
    int32 ops_per_clock = 3;
  }
  map<int32, .stream_executor.ExecutionUnitDescriptionProto.RateInfoProto> rate_infos = 1;
}
message DeviceInterconnectInfoProto {
  int32 active_links = 1;
  string cluster_uuid = 2;
  string clique_id = 3;
}
message GpuDeviceInfoProto {
  oneof compute_capability {
    .stream_executor.CudaComputeCapabilityProto cuda_compute_capability = 16;
    .stream_executor.RocmComputeCapabilityProto rocm_compute_capability = 17;
    .stream_executor.OneAPIComputeCapabilityProto oneapi_compute_capability = 22;
  }
  string device_vendor = 30;
  string platform_version = 31;
  string pci_bus_id = 32;
  string name = 34;
  string model_str = 35;
  int32 threads_per_block_limit = 1;
  int32 threads_per_warp = 2;
  int32 shared_memory_per_block = 3;
  int32 shared_memory_per_core = 4;
  int32 threads_per_core_limit = 5;
  int32 core_count = 6;
  int64 fpus_per_core = 7;
  int64 block_dim_limit_x = 8;
  int64 block_dim_limit_y = 9;
  int64 block_dim_limit_z = 10;
  int64 memory_bandwidth = 11;
  int64 l2_cache_size = 12;
  float clock_rate_ghz = 13;
  int64 device_memory_size = 14;
  int32 shared_memory_per_block_optin = 15;
  int64 registers_per_core_limit = 18;
  int64 registers_per_block_limit = 19;
  .stream_executor.ExecutionUnitDescriptionProto scalar_unit_description = 20;
  .stream_executor.ExecutionUnitDescriptionProto matrix_unit_description = 21;
  string driver_version = 23;
  string kernel_mode_driver_version = 24;
  string runtime_version = 25;
  string compile_time_toolkit_version = 26;
  string dnn_version = 27;
  string cub_version = 28;
  .stream_executor.DeviceInterconnectInfoProto device_interconnect_info = 29;
  int32 numa_node = 36;
  int64 thread_dim_limit_x = 37;
  int64 thread_dim_limit_y = 38;
  int64 thread_dim_limit_z = 39;
  int64 device_address_bits = 40;
  int64 pcie_bandwidth = 41;
  bool ecc_enabled = 42;
  float mem_clock_ghz = 43;
  int64 reserved_shared_memory_per_block = 44;
  int64 max_blocks_per_multiprocessor = 45;
  int64 collective_memory_granularity = 46;
  int64 oversized_shared_memory_per_block = 47;
  bool confidential_computing_enabled = 48;
  int32 locality_domain_count = 49;
}
message RuntimeVersionProto {
  int32 major = 1;
  int32 minor = 2;
  int32 patch = 3;
}
message GpuTargetConfigProto {
  reserved 2;
  reserved 3;
  reserved 5;
  reserved "cuda_compute_capability";
  reserved "rocm_compute_capability";
  reserved "dnn_version_info";
  .stream_executor.GpuDeviceInfoProto gpu_device_info = 1;
  string platform_name = 4;
  .stream_executor.RuntimeVersionProto runtime_version = 8;
  .xla.AutotuneResults autotune_results = 6;
  string device_description_str = 7;
}
