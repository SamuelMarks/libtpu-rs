syntax = "proto3";
package xla;
import "google/protobuf/any.proto";
import "third_party/tensorflow/compiler/xla/hlo/transforms/simplifiers/memory_scheduler.proto";
message MetricsForSingleMemoryScheduler {
  optional .xla.MemorySchedulerProto.Value type = 1;
  optional int64 peak_memory = 2;
  optional bool valid_schedule = 3;
  .google.protobuf.Any params = 4;
}
message MemorySchedulerMetrics {
  repeated .xla.MetricsForSingleMemoryScheduler schedulers = 1;
  optional int32 selected_scheduler_idx = 2;
}
