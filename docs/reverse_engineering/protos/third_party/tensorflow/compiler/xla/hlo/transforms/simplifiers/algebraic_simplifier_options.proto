syntax = "proto2";
package xla;
message AlgebraicSimplifierOptions {
  optional bool is_layout_sensitive = 1;
  optional bool enable_dot_strength_reduction = 2 [default = true];
  optional bool supports_non_canonical_dots = 3 [default = true];
  optional bool enable_dot_to_multiply_rewrite = 4 [default = true];
  optional bool enable_move_dot_param_to_rhs = 5;
  optional bool enable_conv_simplification = 6 [default = true];
  optional bool enable_conv_operand_swap = 7 [default = true];
  optional bool enable_conv_add_multiply_reorder = 8;
  optional bool enable_scalar_multiply_reduction = 9;
  optional bool enable_floats_are_real = 10;
  optional bool enable_window_reduce_to_reduce_replacement = 11 [default = true];
  optional bool enable_reduce_of_reshape = 12 [default = true];
  optional bool enable_negative_padding_replacement = 13 [default = true];
  optional bool enable_dynamic_update_slice_to_pad_replacement = 14 [default = true];
  optional bool enable_sink_broadcast = 15 [default = true];
  optional bool unconditionally_simplify_reduce_of_transpose_or_reshape = 16;
  optional int64 very_small_gather_size = 17 [default = 4];
  optional bool minmax_propagate_nan = 18 [default = true];
  optional bool enable_unconditional_reduce_of_concat_replacement = 19 [default = true];
  optional bool executing_on_cpu = 20;
  optional bool use_associative_reordering = 21;
  optional double associative_reordering_threshold = 22 [default = 2];
  optional bool raise_slice_and_reduce_through_dot = 23;
  optional double raise_slice_and_reduce_through_dot_threshold = 24 [default = 2];
  optional bool use_convert_constant_folding = 25;
  optional bool disable_dynamic_slice_to_slice_conversion = 26;
  optional bool enable_fast_math = 27;
  optional bool enable_broadcast_degenerate_dimension = 28 [default = true];
  optional bool enable_remove_no_op_reduce_precision = 29;
  optional bool enable_onednn_support = 30;
  optional bool rewrite_reshape_transpose_as_slice_concatenate = 31 [default = true];
  optional bool run_to_fixed_point = 32 [default = true];
  optional bool rewrite_no_op_bitcast_convert_to_bitcast = 33;
  optional bool enable_conditional_simplification = 34;
  optional bool enable_hoist_transpose_of_reshape = 35;
  optional bool enable_fold_transpose_into_scatter = 36;
  optional bool enable_folding_pad_into_convolution = 37 [default = true];
  optional string cudnn_batchnorm_forward_training_metadata = 38;
  optional bool enable_reshape_is_bitcast = 39 [default = true];
}
