syntax = "proto3";
package xla;
import "third_party/tensorflow/compiler/xla/service/buffer_assignment.proto";
import "third_party/tensorflow/compiler/xla/xla_data.proto";
message ShapedSliceProto {
  .xla.buffer_assignment.BufferAllocationSliceProto slice = 1;
  .xla.ShapeProto shape = 2;
}
message NullableShapedSliceProto {
  optional .xla.ShapedSliceProto shaped_slice = 1;
}
