syntax = "proto3";
package xla;
import "google/protobuf/any.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "storage/datapol/annotations/proto/semantic_annotations.proto";
message KeyValueMetric {
  string key = 1;
  int64 value = 2;
}
message PassMetrics {
  uint64 module_id = 1;
  string pass_name = 2;
  .google.protobuf.Duration pass_duration = 3;
  .google.protobuf.Any custom_metrics = 4;
  repeated .xla.KeyValueMetric kv_metrics = 5;
}
message JobInfo {
  optional string name = 1;
  optional string cell = 2;
  optional string user = 3;
  optional int64 uid = 4;
  optional int64 task_id = 5;
  optional int64 task_uid = 6;
  optional int64 process_id = 7;
  optional int64 thread_id = 8;
}
message TagMetric {
  string key = 1;
  string value = 2;
}
message CompilationLogEntry {
  enum CompilationStage {
    UNSPECIFIED = 0;
    END_TO_END = 1;
    HLO_PASSES = 2;
    CODE_GENERATION = 3;
    BACKEND_PASSES = 4;
  }
  .google.protobuf.Timestamp timestamp = 1;
  .xla.CompilationLogEntry.CompilationStage stage = 2;
  .google.protobuf.Duration duration = 3;
  int32 task_index = 4;
  repeated .xla.PassMetrics pass_metrics = 5;
  repeated uint64 module_ids = 6;
  .xla.JobInfo job_info = 7;
  string hlo_module_name = 8;
  repeated .xla.TagMetric tag = 9;
  .xla.CompilerBuildInfo compiler_build_info = 10;
}
message CompilerBuildInfo {
  enum ClientStatus {
    CLIENT_STATUS_UNKNOWN = 0;
    CLIENT_STATUS_MINT = 1;
    CLIENT_STATUS_MODIFIED = 2;
  }
  int64 compiler_changelist = 1;
  string compiler_build_label = 2;
  int64 baseline_changelist = 3;
  .xla.CompilerBuildInfo.ClientStatus client_status = 4;
}
