syntax = "proto3";
package xla;
import "google/protobuf/any.proto";
import "third_party/tensorflow/compiler/xla/service/metrics.proto";
import "third_party/tensorflow/compiler/xla/xla_data.proto";
enum CustomCallSchedule {
  SCHEDULE_NONE = 0;
  SCHEDULE_LATEST = 1;
  SCHEDULE_EARLIEST = 2;
}
enum TriState {
  TRI_STATE_UNSPECIFIED = 0;
  TRI_STATE_TRUE = 1;
  TRI_STATE_FALSE = 2;
}
enum ConvolutionKind {
  CONVOLUTION_KIND_UNSET = 0;
  CONVOLUTION_KIND_FPROP = 1;
  CONVOLUTION_KIND_DGRAD = 2;
  CONVOLUTION_KIND_WGRAD = 3;
}
enum CustomCallApiVersion {
  API_VERSION_UNSPECIFIED = 0;
  API_VERSION_ORIGINAL = 1;
  API_VERSION_STATUS_RETURNING = 2;
  API_VERSION_STATUS_RETURNING_UNIFIED = 3;
  API_VERSION_TYPED_FFI = 4;
}
enum Kind {
  UNDEFINED_ALIAS = 0;
  MAY_ALIAS = 1;
  MUST_ALIAS = 2;
}
message HloInstructionProto {
