  .xla.ParameterReplication parameter_replication = 61;
  bool custom_call_has_side_effect = 65;
  repeated .xla.OutputOperandAliasing output_operand_aliasing = 74;
  .xla.CustomCallSchedule custom_call_schedule = 76;
  int64 delta = 66;
