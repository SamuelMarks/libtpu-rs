    int32 version = 1;
    uint64 argument_size_bytes = 2;
  }
  repeated .xla.LiteralProto arguments = 1;
  repeated .xla.HloInputs.LiteralDescriptor arguments_descriptors = 2;
}
message HloUnoptimizedSnapshot {
