syntax = "proto3";
package tensorflow;
import "google/protobuf/any.proto";
import "google/protobuf/wrappers.proto";
message EntryValue {
  oneof kind {
    double double_value = 1;
    string string_value = 2;
  }
}
message MetricEntry {
  string name = 1;
  double value = 2;
  .google.protobuf.DoubleValue min_value = 3;
  .google.protobuf.DoubleValue max_value = 4;
}
message BenchmarkEntry {
  string name = 1;
  int64 iters = 2;
  double cpu_time = 3;
  double wall_time = 4;
  double throughput = 5;
  map<string, .tensorflow.EntryValue> extras = 6;
  repeated .tensorflow.MetricEntry metrics = 7;
}
message BenchmarkEntries {
  repeated .tensorflow.BenchmarkEntry entry = 1;
}
message BuildConfiguration {
  string mode = 1;
  repeated string cc_flags = 2;
  repeated string opts = 3;
}
message CommitId {
  oneof kind {
    int64 changelist = 1;
    string hash = 2;
  }
  string snapshot = 3;
  int64 pending_changelist = 4;
}
message CPUInfo {
  int64 num_cores = 1;
  int64 num_cores_allowed = 2;
  double mhz_per_cpu = 3;
  string cpu_info = 4;
  string cpu_governor = 5;
  map<string, int64> cache_size = 6;
}
message MemoryInfo {
  int64 total = 1;
  int64 available = 2;
}
message GPUInfo {
  string model = 1;
  string uuid = 2;
  string bus_id = 3;
}
message PlatformInfo {
  string bits = 1;
  string linkage = 2;
  string machine = 3;
  string release = 4;
  string system = 5;
  string version = 6;
}
message AvailableDeviceInfo {
  string name = 1;
  string type = 2;
  int64 memory_limit = 3;
  string physical_description = 4;
}
message MachineConfiguration {
  string hostname = 1;
  string serial_identifier = 7;
  .tensorflow.PlatformInfo platform_info = 2;
  .tensorflow.CPUInfo cpu_info = 3;
  repeated .google.protobuf.Any device_info = 4;
  repeated .tensorflow.AvailableDeviceInfo available_device_info = 5;
  .tensorflow.MemoryInfo memory_info = 6;
}
message RunConfiguration {
  repeated string argument = 1;
  map<string, string> env_vars = 2;
}
message TestResults {
  enum BenchmarkType {
    UNKNOWN = 0;
    CPP_MICROBENCHMARK = 1;
    PYTHON_BENCHMARK = 2;
    ANDROID_BENCHMARK = 3;
    EDGE_BENCHMARK = 4;
    IOS_BENCHMARK = 5;
  }
  string target = 1;
  .tensorflow.BenchmarkEntries entries = 2;
  .tensorflow.BuildConfiguration build_configuration = 3;
  .tensorflow.CommitId commit_id = 4;
  int64 start_time = 5;
  double run_time = 6;
  .tensorflow.MachineConfiguration machine_configuration = 7;
  .tensorflow.RunConfiguration run_configuration = 8;
  string name = 9;
  .tensorflow.TestResults.BenchmarkType benchmark_type = 10;
  string run_mode = 11;
  string tf_version = 12;
}
