syntax = "proto3";
package grpc.channelz.v2;
import "third_party/grpc/src/proto/grpc/channelz/v2/property_list.proto";
message Promise {
  enum CompositionKind {
    UNKNOWN = 0;
    NORMAL = 1;
    TRY = 2;
    ALL_OK = 3;
  }
  message Custom {
    string type = 1;
    .grpc.channelz.v2.PropertyList properties = 2;
  }
  message If {
    bool condition = 1;
    string true_factory = 2;
    string false_factory = 3;
    .grpc.channelz.v2.Promise promise = 4;
  }
  message Loop {
    string loop_factory = 1;
    .grpc.channelz.v2.Promise promise = 2;
    bool yield = 3;
  }
  message ForEach {
    string reader_factory = 1;
    string action_factory = 2;
    .grpc.channelz.v2.Promise reader_promise = 3;
    .grpc.channelz.v2.Promise action_promise = 4;
  }
  message Race {
    repeated .grpc.channelz.v2.Promise children = 1;
  }
  message SeqStep {
    string factory = 1;
    .grpc.channelz.v2.Promise polling_promise = 2;
  }
  message Seq {
    .grpc.channelz.v2.Promise.CompositionKind kind = 1;
    repeated .grpc.channelz.v2.Promise.SeqStep steps = 2;
  }
  message JoinBranch {
    oneof state {
      .grpc.channelz.v2.Promise polling_promise = 2;
      string result = 3;
    }
    string factory = 1;
  }
  message Join {
    .grpc.channelz.v2.Promise.CompositionKind kind = 1;
    repeated .grpc.channelz.v2.Promise.JoinBranch branches = 2;
  }
  message Map {
    .grpc.channelz.v2.Promise promise = 1;
    string map_fn = 2;
  }
  oneof promise {
    .grpc.channelz.v2.Promise.Custom custom_promise = 1;
    string unknown_promise = 2;
    .grpc.channelz.v2.Promise.If if_promise = 3;
    .grpc.channelz.v2.Promise.Loop loop_promise = 4;
    .grpc.channelz.v2.Promise.Race race_promise = 5;
    .grpc.channelz.v2.Promise.Seq seq_promise = 6;
    .grpc.channelz.v2.Promise.Join join_promise = 7;
    .grpc.channelz.v2.Promise.Map map_promise = 8;
    .grpc.channelz.v2.Promise.ForEach for_each_promise = 9;
  }
}
