syntax = "proto3";
package tensorflow.profiler;
message DcnCollectiveInfoProto {
  enum TransferType {
    UNKNOWN_TRANSFER_TYPE = 0;
    ALL_TO_ALL = 1;
    ONE_TO_ONE = 2;
    REDUCE_SCATTER = 3;
    ALL_GATHER = 4;
    ALL_REDUCE = 5;
    RAGGED_ALL_TO_ALL = 6;
  }
  message Endpoint {
    int32 slice_id = 1;
    int32 device_id = 2;
  }
  message EndpointGroup {
    repeated .tensorflow.profiler.DcnCollectiveInfoProto.Endpoint endpoints = 1;
  }
  message OneToOneGroup {
    .tensorflow.profiler.DcnCollectiveInfoProto.Endpoint source = 1;
    .tensorflow.profiler.DcnCollectiveInfoProto.Endpoint destination = 2;
  }
  .tensorflow.profiler.DcnCollectiveInfoProto.TransferType transfer_type = 1;
  repeated .tensorflow.profiler.DcnCollectiveInfoProto.EndpointGroup endpoint_groups = 2;
  repeated .tensorflow.profiler.DcnCollectiveInfoProto.OneToOneGroup one_to_one_groups = 3;
}
