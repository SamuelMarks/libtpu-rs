syntax = "proto3";
package tensorflow.profiler;
import "third_party/xprof/plugin/tensorboard_plugin_profile/protobuf/diagnostics.proto";
import "third_party/xprof/plugin/tensorboard_plugin_profile/protobuf/flat_op_metrics.proto";
import "third_party/xprof/plugin/tensorboard_plugin_profile/protobuf/hardware_types.proto";
import "third_party/xprof/plugin/tensorboard_plugin_profile/protobuf/kernel_stats.proto";
import "third_party/xprof/plugin/tensorboard_plugin_profile/protobuf/op_metrics.proto";
import "third_party/xprof/plugin/tensorboard_plugin_profile/protobuf/power_metrics.proto";
import "third_party/xprof/plugin/tensorboard_plugin_profile/protobuf/source_stats.proto";
import "third_party/xprof/plugin/tensorboard_plugin_profile/protobuf/steps_db.proto";
import "third_party/xprof/plugin/tensorboard_plugin_profile/protobuf/tf_function.proto";
import "third_party/xprof/plugin/tensorboard_plugin_profile/protobuf/topology.proto";
message PerfEnv {
  double peak_tera_flops_per_second = 1;
  double peak_bw_giga_bytes_per_second = 4;
  double peak_hbm_bw_giga_bytes_per_second = 2;
  repeated double peak_bws_giga_bytes_per_second = 5;
  double ridge_point = 3;
  bool has_cmem = 6;
  bool has_merged_vmem = 7;
  bool has_megacore = 8;
  double peak_sc_tera_flops_per_second = 9;
  int32 num_sparse_core_tiles = 10;
}
message HostIndependentJobInfoResult {
  int64 change_list = 1;
  string workspace_id = 5;
  int64 snapshot = 6;
  int64 build_time = 2;
  string build_target = 3;
  uint32 profile_duration_ms = 4;
}
message HostDependentJobInfoResult {
  string host_id = 1;
  string command_line = 2;
  int64 start_time = 3;
  string bns_address = 4;
  uint64 profile_time_ns = 5;
}
message SystemTopology {
  int64 x_dimension = 1;
  int64 y_dimension = 2;
  int64 z_dimension = 3;
  int64 num_expected_reduced_chips = 4;
}
message RunEnvironment {
  reserved 6;
  reserved 11;
  int32 host_count = 1;
  int32 task_count = 2;
  map<string, bool> hostnames = 3;
  string device_type = 4;
  int32 device_core_count = 5;
  .tensorflow.profiler.HostIndependentJobInfoResult host_independent_job_info = 7;
  repeated .tensorflow.profiler.HostDependentJobInfoResult host_dependent_job_info = 8;
  int32 replica_count = 9;
  int32 num_cores_per_replica = 10;
  uint32 host_trace_level = 12;
  .tensorflow.profiler.Topology system_topology = 13;
  bool is_training = 14;
  .tensorflow.profiler.PowerMetrics power_metrics = 15;
  .tensorflow.profiler.HardwareType hardware_type = 16;
}
message CoreDetails {
  string hostname = 1;
  uint32 device_ordinal = 2;
  uint32 core_num = 3;
  uint32 local_chip_id = 4;
  uint32 global_chip_id = 5;
  uint32 global_core_id = 6;
  bool is_sparse_core = 7;
}
message PerformanceCounterResult {
  double matrix_unit_utilization_percent = 1;
  double hbm_utilization_percent = 2;
}
message DistributionStats {
  double avg = 1;
  double p50 = 2;
  double p90 = 3;
  double p95 = 4;
  double p99 = 5;
}
message DisaggregatedServingLatency {
  .tensorflow.profiler.DistributionStats prefill_step_time_us = 1;
  int64 num_prefill_steps = 2;
  .tensorflow.profiler.DistributionStats decode_step_time_us = 3;
  int64 num_decode_steps = 4;
}
message OpStats {
  reserved 7;
  .tensorflow.profiler.OpMetricsDb host_op_metrics_db = 1;
  .tensorflow.profiler.OpMetricsDb device_op_metrics_db = 2;
  .tensorflow.profiler.OpMetricsDb hlo_metrics_db_complete_steps_only = 10;
  .tensorflow.profiler.PerfEnv perf_env = 3;
  .tensorflow.profiler.StepDatabaseResult step_db = 4;
  .tensorflow.profiler.RunEnvironment run_environment = 5;
  .tensorflow.profiler.KernelStatsDb kernel_stats_db = 6;
  .tensorflow.profiler.TfFunctionDb tf_function_db = 8;
  map<uint32, .tensorflow.profiler.CoreDetails> core_id_to_details = 11;
  .tensorflow.profiler.Diagnostics diagnostics = 9;
  map<uint64, string> program_id_to_name_map = 12;
  .tensorflow.profiler.PerformanceCounterResult performance_counter_result = 13;
  .tensorflow.profiler.SourceStats source_stats = 14;
  .tensorflow.profiler.DisaggregatedServingLatency disaggregated_serving_latency = 15;
  .tensorflow.profiler.FlatOpMetricsDb flat_device_op_metrics_db = 16;
  .tensorflow.profiler.FlatOpMetricsDb flat_hlo_metrics_db_complete_steps_only = 17;
}
