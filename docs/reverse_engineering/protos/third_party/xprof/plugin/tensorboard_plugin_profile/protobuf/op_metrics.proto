syntax = "proto3";
package tensorflow.profiler;
import "third_party/xprof/plugin/tensorboard_plugin_profile/protobuf/source_info.proto";
enum MemBwType {
  option allow_alias = true;
  MEM_BW_TYPE_FIRST = 0;
  MEM_BW_TYPE_HBM_RW = 0;
  MEM_BW_TYPE_SRAM_RD = 1;
  MEM_BW_TYPE_SRAM_WR = 2;
  MEM_BW_TYPE_CMEM_RD = 3;
  MEM_BW_TYPE_CMEM_WR = 4;
  MEM_BW_TYPE_VMEM_RD = 5;
  MEM_BW_TYPE_VMEM_WR = 6;
  MEM_BW_TYPE_SPMEM_RD = 7;
  MEM_BW_TYPE_SPMEM_WR = 8;
  MEM_BW_TYPE_MAX = 2;
}
enum MemorySpace {
  MEMORY_SPACE_UNDEFINED = 0;
  MEMORY_SPACE_HBM = 1;
  MEMORY_SPACE_ON_CHIP = 2147483646;
  MEMORY_SPACE_ALL = 2147483647;
}
enum LayoutDimensionSemantics {
  UNKNOWN_SEMANTICS = 0;
  FEATURE = 1;
  BATCH = 2;
  SPATIAL = 3;
}
message PerformanceInfo {
  reserved 4;
  message MemoryAccessed {
    enum MemorySpace {
      UNKNOWN = 0;
      HBM = 1;
      CMEM = 2;
      VMEM = 3;
    }
    optional bool is_read = 1;
    optional .tensorflow.profiler.PerformanceInfo.MemoryAccessed.MemorySpace memory_space = 2;
    optional int64 bytes_accessed = 3;
  }
  optional int64 flops = 1;
  optional int64 bytes_accessed = 2;
  repeated .tensorflow.profiler.PerformanceInfo.MemoryAccessed memory_accessed_breakdown = 3;
}
message LayoutAnalysis {
  message Dimension {
    int32 size = 1;
    int32 alignment = 2;
    .tensorflow.profiler.LayoutDimensionSemantics semantics = 3;
  }
  repeated .tensorflow.profiler.LayoutAnalysis.Dimension dimensions = 1;
}
message MemoryAccessBreakdown {
  repeated .tensorflow.profiler.OpMetrics.MemoryAccessed memory_accessed = 1;
}
message OpMetrics {
  reserved 4;
  reserved 8;
  reserved 9;
  enum TpuCoreType {
    UNKNOWN = 0;
    TENSOR_CORE = 1;
    SPARSE_CORE = 2;
  }
  message MemoryAccessed {
    enum OperationType {
      UNKNOWN = 0;
      READ = 1;
      WRITE = 2;
    }
    .tensorflow.profiler.OpMetrics.MemoryAccessed.OperationType operation_type = 1;
    uint64 memory_space = 2;
    uint64 bytes_accessed = 3;
  }
  uint64 hlo_module_id = 13;
  optional int64 stable_op_id = 32;
  string name = 6;
  string long_name = 20;
  string category = 11;
  string provenance = 12;
  bool is_eager = 18;
  uint32 occurrences = 3;
  uint64 time_ps = 7;
  uint64 normalized_time_ps = 27;
  uint64 min_time_ps = 17;
  uint64 self_time_ps = 1;
  uint64 flops = 2;
  uint64 model_flops = 24;
  double flops_v2 = 29;
  double model_flops_v2 = 30;
  optional double vdd_energy_j = 31;
  uint64 fingerprint = 25;
  uint64 bytes_accessed = 5;
  repeated .tensorflow.profiler.OpMetrics.MemoryAccessed memory_accessed_breakdown = 19;
  uint64 dma_stall_ps = 10;
  .tensorflow.profiler.LayoutAnalysis layout = 14;
  string deduplicated_name = 15;
  .tensorflow.profiler.OpMetricsDb children = 16;
  uint32 num_cores = 21;
  uint32 computation_primitive_size = 22;
  bool autotuned = 23;
  optional .tensorflow.profiler.SourceInfo source_info = 26;
  .tensorflow.profiler.OpMetrics.TpuCoreType core_type = 28;
  double estimated_flops = 33;
  double estimated_bytes_accessed = 34;
}
message PrecisionStats {
  uint64 compute_16bit_ps = 1;
  uint64 compute_32bit_ps = 2;
}
message OpMetricsDb {
  reserved 1;
  reserved 4;
  reserved 5;
  reserved 6;
  reserved 7;
  reserved 8;
  reserved 9;
  repeated .tensorflow.profiler.OpMetrics metrics_db = 10;
  uint64 total_host_infeed_enq_duration_ps = 2;
  uint64 total_host_infeed_enq_start_timestamp_ps_diff = 3;
  uint64 total_time_ps = 11;
  uint64 total_op_time_ps = 12;
  uint64 normalized_total_op_time_ps = 16;
  .tensorflow.profiler.PrecisionStats precision_stats = 13;
  uint64 idle_time_ps = 14;
  uint64 busy_time_ps = 15;
  uint64 busy_time_high_confidence_ps = 17;
  uint64 idle_time_high_confidence_ps = 18;
}
