syntax = "proto2";
package operations_research.sat;
message LratImportedClause {
  optional int64 clause_id = 1;
  repeated int32 literals = 2 [packed = true];
  optional int64 one_based_cnf_index = 3;
}
message LratInferredClause {
  message RatInfo {
    optional int64 resolvant_id = 1;
    repeated int64 rup_clause_ids = 2 [packed = true];
  }
  optional int64 clause_id = 1;
  repeated int32 literals = 2 [packed = true];
  repeated int64 rup_clause_ids = 3 [packed = true];
  repeated .operations_research.sat.LratInferredClause.RatInfo rat_infos = 4;
  optional bool exported = 5;
  optional bool rewritten = 6;
}
message LratExportedClause {
  optional int64 clause_id = 1;
  repeated int32 literals = 2 [packed = true];
}
message LratDeletedClauses {
  repeated int64 clause_ids = 1 [packed = true];
}
message BooleanVariableRemapping {
  repeated int32 new_to_old_var = 1 [packed = true];
}
message LratProofStep {
  oneof step {
    .operations_research.sat.LratImportedClause imported_clause = 1;
    .operations_research.sat.LratInferredClause inferred_clause = 2;
    .operations_research.sat.LratExportedClause exported_clause = 3;
    .operations_research.sat.LratDeletedClauses deleted_clauses = 4;
    .operations_research.sat.BooleanVariableRemapping remapping = 5;
  }
}
