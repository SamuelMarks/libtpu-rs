syntax = "proto2";
package pb;
import "n2a/p4r2d3/proto/descriptor.proto";
message JavaFeatures {
  reserved 6;
  enum Utf8Validation {
    UTF8_VALIDATION_UNKNOWN = 0;
    DEFAULT = 1;
    VERIFY = 2;
  }
  message NestInFileClassFeature {
    reserved 1 to 536870911;
    enum NestInFileClass {
      NEST_IN_FILE_CLASS_UNKNOWN = 0;
      NO = 1;
      YES = 2;
      LEGACY = 3;
    }
  }
  optional bool legacy_closed_enum = 1;
  optional .pb.JavaFeatures.Utf8Validation utf8_validation = 2;
  optional bool large_enum = 3;
  optional bool use_old_outer_classname_default = 4;
  optional .pb.JavaFeatures.NestInFileClassFeature.NestInFileClass nest_in_file_class = 5;
}
extend .proto2.FeatureSet {
  optional .pb.JavaFeatures java = 1001;
}
