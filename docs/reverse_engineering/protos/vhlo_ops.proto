syntax = "proto3";

package vhlo;

message VhloDialectVersionProto {
  uint32 major = 1;
  uint32 minor = 2;
  uint32 patch = 3;
  string target_version_string = 4;
}

message StableHloPortableArtifactMetadataProto {
  string artifact_name = 1;
  VhloDialectVersionProto vhlo_version = 2;
  string producer_mlir_version = 3;
  uint64 bytecode_size_bytes = 4;
  string sha256_fingerprint = 5;
}
