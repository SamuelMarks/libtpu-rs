syntax = "proto3";
package berg;
message CheckpointsInfo {
  int64 latest_checkpoint_timestamp = 1;
  int32 number_of_checkpoints = 2;
}
message RestoresInfo {
  int64 latest_restore_timestamp = 1;
  int64 virtual_cycle_offset = 2;
  int64 virtual_monotonic_offset = 3;
  int64 virtual_boot_time_offset = 4;
}
