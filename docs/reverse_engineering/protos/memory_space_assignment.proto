syntax = "proto3";

package xla.jellyfish;

enum ExpandedScopedAlternateMemoryMode {
  EXPANDED_SCOPED_ALTERNATE_MEMORY_MODE_UNSPECIFIED = 0;
  EXPANDED_SCOPED_ALTERNATE_MEMORY_MODE_DISABLED = 1;
  EXPANDED_SCOPED_ALTERNATE_MEMORY_MODE_ENABLED = 2;
  EXPANDED_SCOPED_ALTERNATE_MEMORY_MODE_AGGRESSIVE = 3;
}

message MsaTensorOverrides {
  repeated string pinned_hlo_instruction_names = 1;
  int64 max_alternate_memory_bytes = 2;
}

message MemoryBoundLoopOptimizerOptions {
  bool enabled = 1;
  int32 desired_copy_ratio = 2;
  bool allow_unsatisfied_prefetch = 3;
}

message PreferredPrefetchOverrides {
  double min_async_copy_interval = 1;
  double max_async_copy_interval = 2;
}

message MsaSortOrderOverrides {
  bool prioritize_larger_tensors = 1;
  bool prioritize_longer_live_ranges = 2;
}
