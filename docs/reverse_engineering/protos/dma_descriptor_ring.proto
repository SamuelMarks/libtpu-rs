syntax = "proto3";

package asic_sw.deepsea;

message DmaDescriptorRingConfigProto {
  uint32 ring_id = 1;
  uint32 ring_capacity_entries = 2;
  uint64 head_csr_offset = 3;
  uint64 tail_csr_offset = 4;
  uint32 sync_flag_base_id = 5;
  bool iommu_scatter_gather_enabled = 6;
}
