syntax = "proto3";

package megascale;

import "megascale_addresses.proto";
import "megascale_dcn_topology.proto";

message SliceDeviceListProto {
  int32 slice_id = 1;
  repeated int32 device_ids = 2;
}

message MultiSliceConfigProto {
  int32 num_slices = 1;
  int32 slice_id = 2;
  int32 num_devices_per_slice = 3;
  string coordinator_address = 4;
  repeated SliceDeviceListProto slice_devices = 5;
  xla.megascale.runtime.EndpointAddresses endpoint_addresses = 6;
  xla.megascale.runtime.DCNTopology dcn_topology = 7;
}

message DCNTopologyProto {
  int32 num_slices = 1;
  int32 num_hosts_per_slice = 2;
  int32 transport_type = 3;
}

message RuntimeMetricsProto {
  uint64 completed_barriers = 1;
  uint64 collective_ops_count = 2;
  int32 active_contexts = 3;
  uint64 bytes_transferred = 4;
}
