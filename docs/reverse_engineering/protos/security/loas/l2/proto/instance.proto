syntax = "proto2";
package security_loas_l2;
import "security/loas/l2/proto/common.proto";
import "security/f47fa1c1/proto/core/f47fa1c1_core.proto";
import "storage/datapol/annotations/proto/semantic_annotations.proto";
enum FingerprintAlgorithm {
  FINGERPRINT_ALGORITHM_UNSPECIFIED = 0;
  FINGERPRINT_2011 = 1;
}
enum ConfidentialityState {
  UNSPECIFIED = 0;
  CONFIDENTIAL = 1;
}
message InstanceInfo {
  extensions 100 to max;
}
message InstanceConfidentiality {
  optional .security_loas_l2.ConfidentialityState confidentiality_state = 1;
  optional string instance_platform = 2;
}
message CloudVMInfo {
  optional uint64 project_number_fp = 1;
  optional uint64 project_name_fp = 5;
  optional uint64 instance_number = 2;
  optional uint64 instance_name_fp = 6;
  optional int64 instance_creation_timestamp = 7;
  optional string zone_name = 3;
  repeated string license_id = 8;
  optional .security_loas_l2.FingerprintAlgorithm fingerprint_algorithm = 4;
  optional .security_loas_l2.InstanceConfidentiality instance_confidentiality = 9;
}
extend .security_loas_l2.InstanceInfo {
  optional .security_loas_l2.CloudVMInfo cloud_vm = 101;
  optional .security_loas_l2.DirectPathVmNetworkEndpoints self_asserted_direct_path_vm_network_endpoints = 102;
  optional .f47fa1c1.f47fa1c1 instance_identity_restriction_f47fa1c1 = 103;
}
