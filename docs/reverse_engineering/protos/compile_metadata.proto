syntax = "proto3";

package tensorflow.tpu;

import "dynamic_padding.proto";
import "tensor_shape.proto";
import "types.proto";
import "xla.proto";
import "xla_data.proto";

message TPUCompileMetadataProto {
  message Arg {
    enum Kind {
      INVALID = 0;
      PARAMETER = 1;
      VARIABLE = 2;
      GUARANTEED_CONSTANT = 3;
    }
    DataType dtype = 1;
    TensorShapeProto shape = 2;
    Kind kind = 3;
    xla.OpSharding sharding = 4;
    bool is_same_data_across_replicas = 5;
    bool fast_mem = 7;
    bool requires_broadcast = 9;
  }

  message Retval {
    xla.OpSharding sharding = 1;
  }

  repeated Arg args = 1;
  repeated Retval retvals = 2;
  int32 num_replicas = 3;
  int32 num_cores_per_replica = 4;
  xla.DeviceAssignmentProto device_assignment = 8;
  repeated PaddingMap padding_map = 11;
  int64 session_handle = 12;
  string function_library_fingerprint = 13;
  bool use_spmd_for_xla_partitioning = 15;
  bool allow_separate_sharding_programs = 16;
}
