syntax = "proto3";

package xla;

import "isa_program.proto";
import "target_arguments.proto";

message DeepseaOverlaySectionProto {
  uint32 overlay_id = 1;
  string symbol_name = 2;
  uint64 imem_offset_bytes = 3;
  uint64 byte_size = 4;
  bytes encoded_bundles = 5;
  uint32 core_type = 6;
}

message DeepseaRelocationEntryProto {
  uint64 bundle_offset_bytes = 1;
  uint32 slot_index = 2;
  uint32 buffer_index = 3;
  int64 addend_bytes = 4;
  uint32 memory_space = 5;
}

message DeepseaConstantPoolEntryProto {
  uint32 constant_id = 1;
  uint32 memory_space = 2;
  uint64 offset_bytes = 3;
  bytes payload = 4;
}

message DeepseaSyncFlagInitProto {
  uint32 sync_flag_id = 1;
  uint32 initial_value = 2;
  string debug_label = 3;
}

message DeepseaExecutableProto {
  string module_name = 1;
  xla.IsaProgramProto isa_program = 2;
  repeated DeepseaOverlaySectionProto overlays = 3;
  repeated DeepseaRelocationEntryProto relocations = 4;
  repeated DeepseaConstantPoolEntryProto constants = 5;
  repeated DeepseaSyncFlagInitProto sync_flags = 6;
  xla.TargetArgumentsProto target_arguments = 7;
  int64 vmem_allocation_bytes = 8;
  int64 smem_allocation_bytes = 9;
  int64 cmem_allocation_bytes = 10;
  int64 hbm_scratchpad_bytes = 11;
}
