syntax = "proto3";

package platforms_deepsea.jellyfish.xdb;

message SectionAllocation {
  string section_name = 1;
  uint64 base_offset = 2;
  uint64 byte_size = 3;
  int32 memory_space = 4;
}

message SymbolTableEntry {
  string symbol_name = 1;
  uint64 imem_offset_bytes = 2;
  uint64 byte_size = 3;
}

message HloToLloMapping {
  string hlo_op_name = 1;
  uint32 start_bundle_index = 2;
  uint32 end_bundle_index = 3;
}

message CompilerMetadata {
  int64 program_id = 1;
  int32 replica_count = 2;
  int32 num_cores_per_replica = 3;
  bool is_haltless = 4;
  int64 executable_size = 5;
  int64 optimized_hlo_instruction_count = 6;
  string module_name = 7;
  string executable_fingerprint = 8;
  repeated SectionAllocation section_allocations = 9;
  repeated SymbolTableEntry symbol_table = 10;
  repeated HloToLloMapping hlo_to_llo_mappings = 11;
}
