syntax = "proto2";
package webutil.html.types;
import "google/api/inclusion.proto";
import "java/com/google/apps/jspb/jspb.proto";
import "storage/datapol/annotations/proto/semantic_annotations.proto";
enum CustomSafeUrlScheme {
  TEL = 0;
  SMS = 1;
  CALLTO = 2;
  WTAI = 3;
  RTSP = 4;
  MARKET = 5;
  GEO = 6;
  SKYPE = 7;
  WHATSAPP = 8;
  ITMS = 20;
  ITMS_BOOKS = 9;
  ITMS_BOOKSS = 27;
  GLASS = 10;
  ITMS_APPS = 11;
  ITMS_APPSS = 19;
  ITMS_SERVICES = 22;
  GOOGLEASSISTANT = 12;
  ASSISTANT_SETTINGS = 13;
  SSH = 14;
  INTENT = 15;
  SIP = 16;
  GOOGLEHOME = 17;
  CHROMECAST = 18;
  COMGOOGLECAST = 35;
  PAY = 21;
  GOOGLEAPP = 23;
  CID = 24;
  WEBCAL = 25;
  YOUTUBE = 26;
  FILE = 28;
  CONTENT = 29;
  HELPFULINTERRUPTION = 30;
  GOOGLECHROMEACTION = 31;
  GOOGLECHROME = 32;
  GOOGLECHROMES = 33;
  GOOGLEPHOTOS = 34;
  GOOGLEDEVICEPOLICY = 36;
}
message SafeHtmlProto {
  optional string private_do_not_access_or_else_safe_html_wrapped_value = 2;
}
message SpliceableSafeHtmlProto {
  message Segment {
    oneof value {
      .webutil.html.types.SafeHtmlProto safe_html = 2;
      string placeholder_label = 1;
    }
  }
  repeated .webutil.html.types.SpliceableSafeHtmlProto.Segment segment = 1;
}
message SafeUrlProto {
  optional string private_do_not_access_or_else_safe_url_wrapped_value = 3;
}
message TrustedResourceUrlProto {
  optional string private_do_not_access_or_else_trusted_resource_url_wrapped_value = 4;
}
message SafeStyleProto {
  optional string private_do_not_access_or_else_safe_style_wrapped_value = 5;
}
message SafeScriptProto {
  optional string private_do_not_access_or_else_safe_script_wrapped_value = 6;
}
message SafeStyleSheetProto {
  optional string private_do_not_access_or_else_safe_style_sheet_wrapped_value = 7;
}
