message TpuTopologyProto {
  tpu.TpuVersionProto version = 1;
  tpu.TpuPlatformTypeProto platform_type = 2;
  tpu.TpuChipPartsProto chip_parts = 3;
  tpu.TpuChipConfigProto chip_config = 4;
  tpu.TpuDimensionsProto chips_per_host_bounds = 5;
  tpu.TpuDimensionsProto host_bounds = 6;
  tpu.TpuWrapProto wrap = 7;
  bool twist = 8;
  tpu.TpuRoutingStrategyProto routing_strategy = 9;
}

