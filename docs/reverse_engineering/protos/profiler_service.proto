syntax = "proto3";

package tensorflow;

import "profiler_options.proto";
import "xplane.proto";

message ProfilerServiceMonitorResult {
  string formatted_result = 1;
  double device_idle_time_percent = 2;
  double matrix_unit_utilization_percent = 3;
  double step_time_ms_avg = 4;
}

message ToolRequestOptions {
  string output_formats = 2;
  bool save_to_repo = 3;
}

message ProfileRequest {
  uint64 duration_ms = 1;
  uint64 max_events = 2;
  repeated string tools = 3;
  map<string, ToolRequestOptions> tool_options = 8;
  ProfileOptions opts = 4;
  string repository_root = 5;
  string session_id = 6;
  string host_name = 7;
  bool emit_xspace = 9;
}

message ProfileToolData {
  string name = 1;
  bytes data = 2;
}

message ProfileResponse {
  repeated ProfileToolData tool_data = 6;
  bool empty_trace = 7;
  tensorflow.profiler.XSpace xspace = 8;
  reserved 1, 2, 3, 4, 5;
}

message TerminateRequest {
  string session_id = 1;
}

message TerminateResponse {}

message GetSnapshotRequest {
  string snapshot_session_id = 1;
}

message ContinuousProfilingResponse {}

message StopContinuousProfilingRequest {}

message StopContinuousProfilingResponse {}

message MonitorRequest {
  uint64 duration_ms = 1;
  int32 monitoring_level = 2;
  bool timestamp = 3;
}

message MonitorResponse {
  string data = 1;
  ProfilerServiceMonitorResult monitor_result = 10;
  reserved 2, 3, 4, 5, 6, 7, 8, 9;
}
