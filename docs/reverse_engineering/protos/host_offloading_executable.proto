syntax = "proto3";

package xla;

import "hlo.proto";

message HostOffloadingExecutableProto {
  enum ExecutableType {
    EXECUTABLE_TYPE_INVALID = 0;
    EXECUTABLE_TYPE_PJRT = 1;
    EXECUTABLE_TYPE_NANORT = 2;
  }

  HloModuleProto hlo_module = 1;
  int32 executable_type = 2;
}
