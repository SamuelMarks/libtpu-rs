syntax = "proto3";

package xla.jellyfish;

message JellyfishHostTransferProto {
  int64 channel_id = 1;
  int32 direction = 2;
  uint64 byte_size = 3;
  uint32 sync_flag_id = 4;
  string rendezvous_key = 5;
}

message JellyfishOverlayConfigProto {
  uint32 overlay_id = 1;
  uint64 imem_base_offset = 2;
  uint64 imem_size_bytes = 3;
  bool prefetch_on_launch = 4;
}

message JellyfishCoreProgramProto {
  uint32 core_index = 1;
  uint32 core_type = 2;
  bytes encoded_vliw_stream = 3;
  uint64 entry_pc = 4;
  repeated JellyfishOverlayConfigProto overlays = 5;
  repeated JellyfishHostTransferProto host_transfers = 6;
}

message JellyfishExecutableProto {
  string module_name = 1;
  uint64 compilation_fingerprint = 2;
  int32 tpu_generation = 3;
  repeated JellyfishCoreProgramProto core_programs = 4;
  int64 hbm_scratchpad_bytes = 5;
  int64 vmem_limit_bytes = 6;
}
