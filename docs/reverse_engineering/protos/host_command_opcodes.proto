syntax = "proto3";

package tpu;

enum HostCommandOpcodeProto {
  HOST_COMMAND_OPCODE_INVALID = 0;
  HOST_COMMAND_OPCODE_SEND = 1;
  HOST_COMMAND_OPCODE_RECV = 2;
  HOST_COMMAND_OPCODE_SDC = 3;
  HOST_COMMAND_OPCODE_LOG = 4;
  HOST_COMMAND_OPCODE_FUSION_DEBUGGER = 5;
  HOST_COMMAND_OPCODE_RESERVED06 = 6;
  HOST_COMMAND_OPCODE_SDC_EVENT_LOG = 7;
  HOST_COMMAND_OPCODE_SDC_XSC_TRACE_LOG = 8;
  HOST_COMMAND_OPCODE_SFLAG_WAIT_STATS_LOG = 9;
  HOST_COMMAND_OPCODE_PGQ_METRIC_LOG = 10;
  HOST_COMMAND_OPCODE_HLO_OUTPUT_LOG = 11;
  HOST_COMMAND_OPCODE_USER_CALLBACK_LOG = 12;
  HOST_COMMAND_OPCODE_BREAKPOINT = 13;
  HOST_COMMAND_OPCODE_MEGASCALE_SEND = 14;
  HOST_COMMAND_OPCODE_MEGASCALE_RECV = 15;
  HOST_COMMAND_OPCODE_HOST_EXECUTION = 16;
  HOST_COMMAND_OPCODE_COMPARISON_LOG = 17;
  HOST_COMMAND_OPCODE_TESTING = 254;
  HOST_COMMAND_OPCODE_PROGRAM_CHANGE = 255;
}

message HostCommandEnvelopeProto {
  HostCommandOpcodeProto opcode = 1;
  uint64 continuation_id = 2;
  uint32 device_id = 3;
  uint32 core_index = 4;
  uint64 handler_id = 5;
  bytes payload = 6;
}
