syntax = "proto3";

package tensorflow.profiler;

message TopologyLocation {
  int32 x = 1;
  int32 y = 2;
  int32 z = 3;
  int32 host_x = 4;
  int32 host_y = 5;
  int32 host_z = 6;
  int32 index_on_host = 7;
  int32 global_id = 8;
}

message ProfilerTopology {
  TopologyLocation num_chips = 1;
  TopologyLocation num_hosts = 2;
  repeated TopologyLocation chip_location = 3;
}
