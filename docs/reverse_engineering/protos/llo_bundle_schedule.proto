syntax = "proto3";

package platforms_deepsea.jellyfish.llo;

message LloScheduledInstructionProto {
  uint32 bundle_pc = 1;
  uint32 functional_unit = 2;
  uint32 opcode = 3;
  uint32 predicate_reg = 4;
  uint32 stall_cycles = 5;
  string hlo_instruction_name = 6;
}

message LloBundleScheduleProto {
  string schedule_name = 1;
  uint32 total_cycles = 2;
  uint32 initiation_interval_mii = 3;
  repeated LloScheduledInstructionProto scheduled_instructions = 4;
}
