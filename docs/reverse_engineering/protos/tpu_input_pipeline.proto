syntax = "proto3";

package tensorflow.tpu;

message PerTpuStepDetails {
  int32 step_number = 1;
  double tc_compute_time_ms = 2;
  double scv0_compute_time_ms = 3;
  double infeed_time_ms = 4;
  double outfeed_time_ms = 5;
  double all_reduce_compute_time_ms = 6;
  double all_reduce_sync_time_ms = 7;
}

message TpuBottleneckAnalysis {
  double input_percent = 1;
  double output_percent = 2;
  double tc_idle_percent = 3;
  string input_classification = 4;
  string input_statement = 5;
}

message TpuInputPipelineAnalysisResult {
  bool hardware_is_tpu = 1;
  double infeed_percent_average = 2;
  double infeed_percent_minimum = 3;
  double infeed_percent_maximum = 4;
  double infeed_percent_standard_deviation = 5;
  double step_time_ms_average = 6;
  repeated PerTpuStepDetails step_details = 7;
  TpuBottleneckAnalysis bottleneck_analysis = 8;
}
