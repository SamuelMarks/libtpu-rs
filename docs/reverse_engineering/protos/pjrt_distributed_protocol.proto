syntax = "proto3";

package xla;

message DeviceProto {
  int32 local_device_ordinal = 1;
  string name = 2;
  string vendor = 3;
  int32 global_device_id = 4;
  int32 partition_index = 5;
  string compute_capability = 6;
  int32 core_count = 7;
  string device_kind = 8;
  string to_string = 9;
  string debug_string = 10;
  string fabric_uuid = 12;
  int32 shared_memory_per_block_optin = 13;
  int32 numa_node = 14;
  int64 device_memory_bytes_limit = 15;
}

message LocalTopologyProto {
  int32 process_id = 1;
  string boot_id = 2;
  repeated DeviceProto devices = 3;
  int32 partition_index = 4;
  repeated string network_nodes = 5;
}

message GlobalTopologyProto {
  repeated LocalTopologyProto processes = 1;
}
