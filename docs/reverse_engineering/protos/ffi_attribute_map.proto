syntax = "proto3";

package xla.ffi;

option java_multiple_files = true;
option java_outer_classname = "AttributeMap";

message ScalarProto {
  bool b = 1;
  int32 i32 = 4;
  int64 i64 = 5;
  float f32 = 10;
  double f64 = 11;
}

message ArrayProto {
  repeated int32 i32_values = 3;
  repeated int64 i64_values = 4;
  repeated float f32_values = 9;
  repeated double f64_values = 10;
}

message FlatAttributeProto {
  ScalarProto scalar = 1;
  ArrayProto array = 2;
  bytes str = 3;
}

message FlatAttributesMapProto {
  map<string, FlatAttributeProto> attrs = 1;
}
