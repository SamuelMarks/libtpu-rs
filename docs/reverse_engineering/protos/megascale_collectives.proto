syntax = "proto3";

package xla.megascale.runtime;

message MegascaleChannelSliceDescriptorProto {
  uint32 channel_id = 1;
  int32 src_slice_id = 2;
  int32 dst_slice_id = 3;
  uint64 payload_bytes = 4;
  uint32 ici_ring_stage = 5;
}

message MegascaleCollectiveScheduleProto {
  string collective_name = 1;
  int32 reduction_kind = 2;
  bool hierarchical_ici_then_dcn = 3;
  repeated MegascaleChannelSliceDescriptorProto channel_descriptors = 4;
}
