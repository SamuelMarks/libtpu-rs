syntax = "proto3";
package pjrt.tpu_topology_extension;
message SliceConfig {
  string name = 1;
  repeated int32 dimensions = 2;
  repeated bool wraps = 3;
  bool twist = 4;
}
message TpuPlatformConfig {
  string platform_type_name = 1;
  repeated .pjrt.tpu_topology_extension.SliceConfig slice_configs = 2;
  int64 num_chips_per_tray = 3;
  int64 num_trays = 4;
}
message TpuPlatformConfigs {
  repeated .pjrt.tpu_topology_extension.TpuPlatformConfig platform_configs = 1;
}
