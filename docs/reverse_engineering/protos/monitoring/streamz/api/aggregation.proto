syntax = "proto2";
package streamz;
import "google/protobuf/duration.proto";
import "monitoring/streamz/api/data_model.proto";
import "monitoring/streamz/api/hierarchical_isolation.proto";
import "net/base/qos.proto";
import "storage/datapol/annotations/proto/semantic_annotations.proto";
message AggregateWriteRequest {
  optional .streamz.Entity entity = 1;
  repeated string target_schema_name = 3;
  repeated .streamz.PointSet point_set = 2;
  optional .streamz.HierarchicalIsolationRole isolation_role = 4;
}
message AggregateWriteResponse {
}
message BulkAggregateWriteRequest {
  enum Source {
    NOT_SET = 0;
    ef5bb7 = 1;
    GCM_API = 2;
    MONITORING_PROBERS = 3;
    PROBER_SERVICE = 4;
  }
  repeated .streamz.AggregateWriteRequest request = 1;
  optional .streamz.HierarchicalIsolationRole isolation_role = 2;
  optional bool ignore_no_matching_target_families = 3;
  optional .streamz.BulkAggregateWriteRequest.Source source = 4 [default = NOT_SET];
  optional bool skip_tee = 5 [default = false];
}
message BulkAggregateWriteResponse {
}
message ReadAggregationPoliciesRequest {
  message ExistingTargetInfo {
    optional bytes target_key = 1;
    optional fixed64 schedules_fingerprint = 2;
  }
  optional .streamz.Entity entity = 1;
  repeated string metric_name = 2;
  optional fixed64 target_recipes_fingerprint = 3;
  optional fixed64 aggregation_policies_sequence_number = 4;
  repeated .streamz.ReadAggregationPoliciesRequest.ExistingTargetInfo existing_target_info = 5;
  optional .streamz.HierarchicalIsolationRole isolation_role = 6;
}
message ReadAggregationPoliciesResponse {
  message TargetInfo {
    message Schedule {
      optional string metric_name = 1;
      optional .google.protobuf.Duration sampling_period = 2;
      optional .net_base.qos.TrafficClass traffic_class = 3;
    }
    optional bytes target_key = 1;
    optional fixed64 schedules_fingerprint = 2;
    repeated .streamz.ReadAggregationPoliciesResponse.TargetInfo.Schedule schedule = 3;
  }
  optional fixed64 target_recipe_fingerprint = 1;
  optional fixed64 aggregation_policies_sequence_number = 2;
  repeated .streamz.ReadAggregationPoliciesResponse.TargetInfo target_info = 3;
}
service StreamzAggregation {
  rpc BulkWrite(.streamz.BulkAggregateWriteRequest) returns (.streamz.BulkAggregateWriteResponse);
  rpc ReadAggregationPolicies(.streamz.ReadAggregationPoliciesRequest) returns (.streamz.ReadAggregationPoliciesResponse);
}
