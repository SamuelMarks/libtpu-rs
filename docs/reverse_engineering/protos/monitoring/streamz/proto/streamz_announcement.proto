syntax = "proto3";
package monitoring.streamz;
import "third_party/protobuf/cpp_features.proto";
message StreamzAnnouncement {
  message Label {
    string name = 1;
    string string_value = 2;
    int64 int64_value = 3;
    bool bool_value = 4;
  }
  int64 birth_timestamp = 1;
  int64 announcement_timestamp = 6;
  string hostname = 2;
  repeated int32 rpcserver_port = 3;
  string root = 4;
  repeated .monitoring.streamz.StreamzAnnouncement.Label label = 5;
}
