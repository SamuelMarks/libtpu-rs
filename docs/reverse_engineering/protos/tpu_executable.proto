syntax = "proto3";

package tensorflow;

import "xla/service/hlo.proto";
import "xla/xla_data.proto";
import "tensorflow/core/framework/tensor_shape.proto";

// A serialization of TPUExecutable. Only includes fields necessary to load
// and execute a program on a worker node.
message TPUExecutableInfoProto {
  reserved 1;

  // The shapes of the inputs and outputs.
  repeated xla.ShapeProto input_shapes = 2;
  reserved 7;  // was input_shape
  xla.ShapeProto output_shape = 3;

  message UpdateIndexPair {
    int32 index = 1;
    bool updated = 2;
  }

  message ShapeIndex {
    repeated int32 index = 1;
  }

  // Dynamic output indices indicate which outputs have dynamic dimensions.
  repeated ShapeIndex dynamic_output_indices = 11;

  // For each resource variable output, what was the index of the corresponding
  // input and was it updated? The indices are sorted by input order.
  repeated UpdateIndexPair variable_indices = 10;

  // The shapes of the outputs when represented as Tensors. These may not
  // match the output_shape values because we may flatten tensors to avoid
  // excess padding.
  repeated TensorShapeProto output_tensor_shapes = 8;

  reserved 4;

  // Optional session module for passing XLA computations between TPUCompileOp
  // and TPUExecuteOp. This is needed to support the
  // --xla_dump_hlo_snapshots flag.
  xla.HloSnapshot session_module = 5;

  // The physical device ids assigned to the replicated cores.
  xla.DeviceAssignmentProto device_assignment = 6;
}

message TPUHostTransferInfoProto {
  reserved 1;
  // Serialized metadata for a data transfer between device and host.
  repeated bytes serialized_transfers = 2 [ctype = CORD];
}

// --- pjrt/tpu_executable.proto ---
// Embedded FileDescriptorProto: learning/45eac/research/pjrt/tpu_executable.proto
syntax = "editions";
package xla;
import "platforms/xla/service/jellyfish/deepsea_executable.proto";
import "platforms/xla/service/jellyfish/isa_program.proto";
import "platforms/xla/service/jellyfish/target_arguments.proto";
import "third_party/tensorflow/compiler/xla/pjrt/proto/compile_options.proto";
import "third_party/tensorflow/compiler/xla/xla.proto";

message TpuExecutableProto {
  xla.DeepseaExecutableProto ds_executable = 1;
  xla.HloModuleProtoWithConfig hlo_module_with_config = 2;
  repeated xla.HostTransferProto host_transfers = 3;
  repeated xla.HostExecutionProto host_executions = 8;
  xla.CompileOptionsProto compile_options = 4;
  xla.TargetArgumentsProto target_arguments = 5;
  string source_uri = 9;
}

// --- xla/tpu_executable.proto ---
// Embedded FileDescriptorProto: learning/45eac/google/xla/tpu_executable.proto
syntax = "editions";
package tensorflow;
import "platforms/xla/service/jellyfish/isa_program.proto";
import "third_party/tensorflow/compiler/xla/service/hlo.proto";
import "third_party/tensorflow/compiler/xla/xla_data.proto";
import "third_party/tensorflow/core/framework/tensor_shape.proto";

message TPUExecutableProto {
  xla.IsaProgramProto isa_program = 1;
  repeated xla.ShapeProto input_shapes = 2;
  xla.ShapeProto output_shape = 3;
  repeated tensorflow.TPUExecutableProto.ShapeIndex dynamic_output_indices = 11;
  repeated tensorflow.TPUExecutableProto.UpdateIndexPair variable_indices = 10;
  repeated tensorflow.TensorShapeProto output_tensor_shapes = 8;
  repeated xla.HloProfileInformation profile = 4;
  xla.HloSnapshot session_module = 5;
  xla.DeviceAssignmentProto device_assignment = 6;
  message UpdateIndexPair {
    int32 index = 1;
    bool updated = 2;
  }
  message ShapeIndex {
    repeated int32 index = 1;
  }
}
