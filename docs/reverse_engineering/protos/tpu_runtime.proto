syntax = "proto3";

package stream_executor;

option java_multiple_files = true;
option java_outer_classname = "ExecutableAbiVersionOuter";

message ExecutableAbiVersionProto {
  string platform_name = 1;

  message CudaPlatformVersion {
    bytes cuda_toolkit_version = 1;
    bytes cudnn_version = 2;
    bytes cub_version = 3;
  }

  oneof platform_specific_version {
    CudaPlatformVersion cuda_platform_version = 3;
  }
}

// --- tpu_runtime_abi.proto ---
// Embedded FileDescriptorProto: learning/45eac/tpu/runtime/tpu_runtime_abi.proto
syntax = "editions";
package tpu;
import "learning/45eac/tpu/runtime/host_commands/host_command_opcodes.proto";
import "learning/45eac/tpu/runtime/tpu_version.proto";

message TpuCoreProgramAbiOptionsProto {
  bool use_continuations = 1;
}

message TpuRuntimeAbiHostCommandVersionProto {
  tpu.HostCommandOpcodeProto opcode = 1;
  int64 version = 2;
}

message TpuCoreProgramAbiProto {
  tpu.TpuVersionProto version = 1;
  string variant = 2;
  string chip_config = 3;
  int64 base_abi_version = 4;
  int64 hardware_abi_version = 5;
  string required_compiler_hash = 6;
  tpu.TpuCoreProgramAbiOptionsProto options = 7;
  repeated tpu.TpuRuntimeAbiHostCommandVersionProto host_command_abi_versions = 8;
}

message TpuRuntimeAbiProto {
  int64 base_abi_version = 1;
  repeated tpu.TpuRuntimeAbiProto.HardwareAbiVersion hardware_abi_versions = 2;
  string compiler_hash = 3;
  repeated tpu.TpuRuntimeAbiHostCommandVersionProto host_command_abi_versions = 4;
  message HardwareAbiVersion {
    tpu.TpuVersionProto version = 1;
    string variant = 2;
    string chip_config = 3;
    int64 abi_version = 4;
  }
}
