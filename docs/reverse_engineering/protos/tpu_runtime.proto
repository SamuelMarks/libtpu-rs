syntax = "proto3";

package stream_executor;

option java_multiple_files = true;
option java_outer_classname = "RuntimeAbiVersionOuter";

message RuntimeAbiVersionProto {
  string platform_name = 1;
  // Each platform can encode any information about the ABI version in this
  // field. Usually a serialized proto.
  bytes platform_specific_version = 2;
}

