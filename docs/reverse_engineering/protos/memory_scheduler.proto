syntax = "proto3";

package xla;

enum MemorySchedulerAlgorithmProto {
  MEMORY_SCHEDULER_DEFAULT = 0;
  MEMORY_SCHEDULER_DFS = 1;
  MEMORY_SCHEDULER_POST_ORDER = 2;
  MEMORY_SCHEDULER_LIST = 3;
}

message MemorySchedulerProto {
  MemorySchedulerAlgorithmProto algorithm = 1;
  int64 memory_limit_bytes = 2;
}
