[workspace]
resolver = "3"
members = [
    "crates/libtpu-core",
    "crates/libtpu-c-api",
    "crates/libtpu-py",
]

[workspace.package]
version = "0.0.50"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/SamuelMarks/libtpu-rs"
readme = "../../README.md"
description = "Clean-room Rust implementation of Google Cloud TPU runtime library (libtpu) with C, C++, and Python FFI."
keywords = ["tpu", "pjrt", "xla", "jax", "machine-learning"]
categories = ["science", "api-bindings", "hardware-support"]

[workspace.dependencies]
bitflags = { version = "2.13", default-features = false }
blake3 = { version = "1.8", default-features = false }
brotli = { version = "9.1", default-features = false, features = ["std"] }
bytemuck = { version = "1.25", default-features = false, features = ["derive", "extern_crate_alloc"] }
cpp_demangle = { version = "0.5", default-features = false, features = ["alloc"] }
derive_more = { version = "2.1", default-features = false, features = ["add", "display", "error", "from", "into"] }
float8 = { version = "0.7", default-features = false }
gimli = { version = "0.34", default-features = false, features = ["read"] }
goblin = { version = "0.10", default-features = false, features = ["archive", "elf32", "elf64", "endian_fd", "mach32", "mach64", "pe32", "pe64", "te"] }
half = { version = "2.7", default-features = false }
iced-x86 = { version = "1.21", default-features = false, features = ["decoder", "instr_info", "std"] }
indexmap = { version = "2.14", default-features = false, features = ["std"] }
lexopt = { version = "0.3", default-features = false }
libc = { version = "0.2", default-features = false }
libtpu-core = { version = "0.0", path = "crates/libtpu-core" }
memmap2 = { version = "0.9", default-features = false }
nix = { version = "0.31", default-features = false }
num-complex = { version = "0.4", default-features = false }
num_enum = { version = "0.7", default-features = false }
object = { version = "0.40", default-features = false, features = ["elf", "macho", "read_core"] }
parking_lot = { version = "0.13", default-features = false }
petgraph = { version = "0.8", default-features = false, features = ["stable_graph"] }
proptest = { version = "1.12", default-features = false, features = ["std"] }
prost = { version = "0.14", default-features = false, features = ["derive"] }
prost-build = { version = "0.14", default-features = false }
prost-reflect = { version = "0.16", default-features = false, features = ["serde"] }
prost-types = { version = "0.14", default-features = false }
protox = { version = "0.10", default-features = false }
rustix = { version = "1.1", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
sha2 = { version = "0.11", default-features = false }
smallvec = { version = "1.16", default-features = false }
winnow = { version = "1.0", default-features = false, features = ["alloc", "ascii"] }

[workspace.lints.rust]
missing_docs = "forbid"
missing_debug_implementations = "deny"
unsafe_op_in_unsafe_fn = "forbid"
unreachable_pub = "deny"
unused_qualifications = "deny"
variant_size_differences = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }

[workspace.lints.rustdoc]
broken_intra_doc_links = "forbid"
missing_crate_level_docs = "forbid"
private_intra_doc_links = "deny"
bare_urls = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
literal_string_with_formatting_args = "allow"
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"
todo = "forbid"
unimplemented = "forbid"
unreachable = "forbid"
indexing_slicing = "deny"
multiple_crate_versions = "allow"
dbg_macro = "forbid"
missing_docs_in_private_items = "forbid"
missing_errors_doc = "forbid"
missing_panics_doc = "forbid"
missing_safety_doc = "forbid"
undocumented_unsafe_blocks = "forbid"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
cast_precision_loss = "deny"
ptr_as_ptr = "deny"
borrow_as_ptr = "deny"
clone_on_ref_ptr = "deny"
lossy_float_literal = "deny"
rest_pat_in_fully_bound_structs = "deny"
return_self_not_must_use = "deny"
semicolon_if_nothing_returned = "deny"
str_to_string = "deny"
implicit_clone = "deny"
try_err = "deny"
unnecessary_safety_comment = "deny"
unnecessary_safety_doc = "deny"
unneeded_field_pattern = "deny"
verbose_file_reads = "deny"
