repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt, ruff format & clang-format (auto-format and recheck)
        entry: python3 scripts/pre_commit.py fmt
        language: system
        pass_filenames: false
        always_run: true

      - id: cargo-build
        name: cargo build & cmake build
        entry: python3 scripts/pre_commit.py build
        language: system
        pass_filenames: false
        always_run: true

      - id: cargo-clippy
        name: cargo clippy, rustdoc, ruff check, mypy & doxygen
        entry: python3 scripts/pre_commit.py clippy
        language: system
        pass_filenames: false
        always_run: true

      - id: cargo-test
        name: cargo test, pytest & ctest
        entry: python3 scripts/pre_commit.py test
        language: system
        pass_filenames: false
        always_run: true

      - id: update-shields
        name: update '% doc coverage' & '% test coverage' shields in README.md
        entry: python3 scripts/pre_commit.py shields
        language: system
        pass_filenames: false
        always_run: true
