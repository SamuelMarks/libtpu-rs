repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: python3 scripts/pre_commit.py cargo-fmt
        language: system
        pass_filenames: false
        always_run: true

      - id: ruff-format
        name: ruff format
        entry: python3 scripts/pre_commit.py ruff-format
        language: system
        pass_filenames: false
        always_run: true

      - id: clang-format
        name: clang-format --style=LLVM
        entry: python3 scripts/pre_commit.py clang-format
        language: system
        pass_filenames: false
        always_run: true

      - id: cargo-build
        name: cargo build & cmake build
        entry: python3 scripts/pre_commit.py build
        language: system
        pass_filenames: false
        always_run: true

      - id: cargo-clippy
        name: cargo clippy, rustdoc, ruff check, mypy & doxygen
        entry: python3 scripts/pre_commit.py clippy
        language: system
        pass_filenames: false
        always_run: true

      - id: google-libtpu-abi
        name: verify official Google libtpu (libtpu.so v0.0.50) binary ABI compatibility
        entry: python3 scripts/pre_commit.py abi
        language: system
        pass_filenames: false
        always_run: true

      - id: cargo-test
        name: cargo test, pytest & ctest
        entry: python3 scripts/pre_commit.py test
        language: system
        pass_filenames: false
        always_run: true

      - id: update-shields
        name: update '% doc coverage' & '% test coverage' shields in README.md
        entry: python3 scripts/pre_commit.py shields
        language: system
        pass_filenames: false
        always_run: true
