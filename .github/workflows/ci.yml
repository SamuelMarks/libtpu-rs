name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: "Hook 1: Format Check (cargo fmt, ruff format, clang-format)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Rust toolchain with rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install clang-format and ruff
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang-format
          python -m pip install --upgrade pip ruff

      - name: Run pre-commit fmt hook (--check)
        run: python3 scripts/pre_commit.py fmt --check

  build:
    name: "Hook 2: Build (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Install CMake and Clang on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake clang llvm

      - name: Run pre-commit build hook (cargo build & cmake build)
        env:
          CC: clang
          CXX: clang++
        run: python3 scripts/pre_commit.py build --check

  clippy-and-lint:
    name: "Hook 3: Strict Lints & Docs (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Rust toolchain with clippy and rustdoc
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rust-docs

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Install Doxygen and Python linters (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends doxygen graphviz
          python -m pip install --upgrade pip ruff mypy pytest pyelftools numpy ml_dtypes maturin jax

      - name: Install Doxygen and Python linters (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install doxygen
          python -m pip install --upgrade pip ruff mypy pytest pyelftools numpy ml_dtypes maturin jax

      - name: Run pre-commit clippy hook (clippy, rustdoc, ruff check, mypy, doxygen)
        run: python3 scripts/pre_commit.py clippy --check

  test:
    name: "Hook 4: Test Suites (${{ matrix.os }}, Python ${{ matrix.python-version }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Install CMake, Clang, and Python test dependencies
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends cmake clang llvm
          fi
          python -m pip install --upgrade pip pytest pytest-cov pyelftools numpy ml_dtypes maturin jax

      - name: Build workspace and run ABI, proto-sync, ASan/UBSan, and test hooks
        env:
          CC: clang
          CXX: clang++
        run: |
          python3 scripts/pre_commit.py build --check
          python3 scripts/pre_commit.py abi --check
          python3 scripts/pre_commit.py proto-sync --check
          python3 scripts/pre_commit.py test --check
          cmake -B cpp/build-asan -S cpp -DENABLE_SANITIZERS=ON
          cmake --build cpp/build-asan
          ctest --test-dir cpp/build-asan --output-on-failure
          rm -rf cpp/build-asan

  coverage-and-shields:
    name: "Hook 5: 100% Doc & Test Coverage + Shields (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Rust stable and nightly toolchains
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: llvm-tools-preview, rustfmt, clippy

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Install system and Python dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang clang-format cmake doxygen llvm
          python -m pip install --upgrade pip ruff mypy pytest pytest-cov pyelftools numpy ml_dtypes maturin jax pre-commit

      - name: Install system and Python dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install clang-format doxygen
          python -m pip install --upgrade pip ruff mypy pytest pytest-cov pyelftools numpy ml_dtypes maturin jax pre-commit

      - name: Run full pre-commit pipeline in strict 100% doc/line/function/branch check mode
        env:
          CC: clang
          CXX: clang++
        run: |
          python3 scripts/pre_commit.py all --check
          python3 -c '
          import json
          rs = json.load(open("target/llvm-cov/coverage.json"))["data"][0]["totals"]
          assert rs["lines"]["percent"] == 100.0, rs["lines"]
          assert rs["functions"]["percent"] == 100.0, rs["functions"]
          assert rs["branches"]["percent"] == 100.0 and rs["branches"]["count"] > 0, rs["branches"]
          py = json.load(open("target/llvm-cov/py_coverage.json"))["totals"]
          assert py["missing_lines"] == 0 and py["missing_branches"] == 0 and py["percent_covered"] == 100.0, py
          cpp = json.load(open("target/llvm-cov/cpp_coverage.json"))["data"][0]["totals"]
          assert cpp["lines"]["percent"] == 100.0, cpp["lines"]
          assert cpp["functions"]["percent"] == 100.0, cpp["functions"]
          assert cpp["regions"]["percent"] == 100.0, cpp["regions"]
          assert cpp["branches"]["percent"] == 100.0 and cpp["branches"]["count"] > 0, cpp["branches"]
          '

      - name: Run pre-commit framework over all hooks
        env:
          CC: clang
          CXX: clang++
        run: |
          pre-commit run --all-files --show-diff-on-failure
          git diff --exit-code
