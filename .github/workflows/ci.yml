name: CI & Pre-commit Quality Gates

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: "Hook 1: Format Check (cargo fmt, ruff format, clang-format)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Rust toolchain with rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install clang-format and ruff
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang-format
          python -m pip install --upgrade pip ruff

      - name: Run pre-commit fmt hook (--check)
        run: python3 scripts/pre_commit.py fmt --check

  build:
    name: "Hook 2: Build (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Install CMake and Clang on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake clang llvm

      - name: Run pre-commit build hook (cargo build & cmake build)
        env:
          CC: clang
          CXX: clang++
        run: python3 scripts/pre_commit.py build --check

  clippy-and-lint:
    name: "Hook 3: Strict Lints & Docs (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Rust toolchain with clippy and rustdoc
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rust-docs

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Install Doxygen and Python linters (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends doxygen graphviz
          python -m pip install --upgrade pip ruff mypy pytest

      - name: Install Doxygen and Python linters (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install doxygen
          python -m pip install --upgrade pip ruff mypy pytest

      - name: Run pre-commit clippy hook (clippy, rustdoc, ruff check, mypy, doxygen)
        run: python3 scripts/pre_commit.py clippy --check

  test:
    name: "Hook 4: Test Suites (${{ matrix.os }}, Python ${{ matrix.python-version }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Install CMake, Clang, and pytest-cov
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends cmake clang llvm
          fi
          python -m pip install --upgrade pip pytest pytest-cov

      - name: Build workspace and run pre-commit test hook (cargo test, pytest, ctest)
        env:
          CC: clang
          CXX: clang++
        run: |
          python3 scripts/pre_commit.py build --check
          python3 scripts/pre_commit.py test --check

  coverage-and-shields:
    name: "Hook 5: 100% Doc & Test Coverage + Shields (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Rust stable and nightly toolchains
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: llvm-tools-preview, rustfmt, clippy

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Install system and Python dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang clang-format cmake doxygen llvm
          python -m pip install --upgrade pip ruff mypy pytest pytest-cov pre-commit

      - name: Install system and Python dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install clang-format doxygen
          python -m pip install --upgrade pip ruff mypy pytest pytest-cov pre-commit

      - name: Run full pre-commit pipeline in strict check mode
        env:
          CC: clang
          CXX: clang++
        run: python3 scripts/pre_commit.py all --check

      - name: Run pre-commit framework over all hooks
        env:
          CC: clang
          CXX: clang++
        run: |
          pre-commit run --all-files --show-diff-on-failure
          git diff --exit-code
