syntax = "proto3";

package libtpu.ext.xplane;

import "third_party/tensorflow/tsl/profiler/protobuf/profiler_options.proto";
import "third_party/tensorflow/tsl/profiler/protobuf/profiler_service_monitor_result.proto";
import "third_party/tensorflow/tsl/profiler/protobuf/xplane.proto";

// Host profiler tool output options.
message ToolRequestOptionsProto {
  string output_formats = 1;
  bool save_to_repo = 2;
}

// Host profiler session request parameters.
message ProfileRequestProto {
  uint64 duration_ms = 1;
  uint64 max_events = 2;
  repeated string tools = 3;
  map<string, ToolRequestOptionsProto> tool_options = 4;
  .tensorflow.ProfileOptions opts = 5;
  string repository_root = 6;
  string session_id = 7;
  string host_name = 8;
  bool emit_xspace = 9;
}

// Profiler tool artifact payload.
message ProfileToolDataProto {
  string name = 1;
  bytes data = 2;
}

// Profiler session capture response.
message ProfileResponseProto {
  repeated ProfileToolDataProto tool_data = 1;
  bool empty_trace = 2;
  .tensorflow.profiler.XSpace xspace = 3;
}

// Profiler session termination request.
message TerminateRequestProto {
  string session_id = 1;
}

// Profiler session termination response.
message TerminateResponseProto {}

// Continuous profiler snapshot request.
message GetSnapshotRequestProto {
  string snapshot_session_id = 1;
}

// Continuous profiling response.
message ContinuousProfilingResponseProto {}

// Stop-continuous-profiling request.
message StopContinuousProfilingRequestProto {}

// Stop-continuous-profiling response.
message StopContinuousProfilingResponseProto {}

// Hardware utilization monitor request.
message MonitorRequestProto {
  uint64 duration_ms = 1;
  int32 monitoring_level = 2;
  bool timestamp = 3;
}

// Hardware utilization monitor response.
message MonitorResponseProto {
  string data = 1;
  .tensorflow.ProfilerServiceMonitorResult monitor_result = 2;
}

// Per-step TPU execution timing breakdown.
message PerTpuStepDetailsProto {
  int32 step_number = 1;
  double tc_compute_time_ms = 2;
  double scv0_compute_time_ms = 3;
  double infeed_time_ms = 4;
  double outfeed_time_ms = 5;
  double all_reduce_compute_time_ms = 6;
  double all_reduce_sync_time_ms = 7;
}

// TPU input pipeline bottleneck classification summary.
message TpuBottleneckAnalysisProto {
  double input_percent = 1;
  double output_percent = 2;
  double tc_idle_percent = 3;
  string input_classification = 4;
  string input_statement = 5;
}

// TPU input pipeline analysis result.
message TpuInputPipelineAnalysisResultProto {
  bool hardware_is_tpu = 1;
  double infeed_percent_average = 2;
  double infeed_percent_minimum = 3;
  double infeed_percent_maximum = 4;
  double infeed_percent_standard_deviation = 5;
  double step_time_ms_average = 6;
  repeated PerTpuStepDetailsProto step_details = 7;
  TpuBottleneckAnalysisProto bottleneck_analysis = 8;
}
