syntax = "proto3";

package libtpu.ext.pjrt;

// OpenXLA distributed host device descriptor.
message DistributedDeviceProto {
  int32 local_device_ordinal = 1;
  string name = 2;
  string vendor = 3;
  int32 global_device_id = 4;
  int32 partition_index = 5;
  string compute_capability = 6;
  int32 core_count = 7;
  string device_kind = 8;
  string to_string = 9;
  string debug_string = 10;
  string fabric_uuid = 11;
  int32 shared_memory_per_block_optin = 12;
  int32 numa_node = 13;
  int64 device_memory_bytes_limit = 14;
}

// OpenXLA distributed per-host local topology descriptor.
message LocalTopologyProto {
  int32 process_id = 1;
  string boot_id = 2;
  repeated DistributedDeviceProto devices = 3;
  int32 partition_index = 4;
  repeated string network_nodes = 5;
}

// OpenXLA distributed global cluster topology descriptor.
message GlobalTopologyProto {
  repeated LocalTopologyProto processes = 1;
}

// JAX Python host callback descriptor.
message PyHostCallbackProto {
  bytes callable = 1;
}

// JAX PyTree dictionary key string table indices.
message DictKeysProto {
  repeated uint32 str_id = 1;
}

// JAX PyTree node definition.
message PyTreeNodeDefProto {
  uint32 arity = 1;
  int32 type = 2;
  DictKeysProto dict_keys = 3;
}

// JAX PyTree flattened definition.
message PyTreeDefProto {
  repeated PyTreeNodeDefProto nodes = 1;
  repeated string interned_strings = 2;
}

// VHLO dialect semantic version descriptor.
message VhloDialectVersionProto {
  uint32 major = 1;
  uint32 minor = 2;
  uint32 patch = 3;
  string target_version_string = 4;
}

// StableHLO portable artifact metadata descriptor.
message StableHloPortableArtifactMetadataProto {
  string artifact_name = 1;
  VhloDialectVersionProto vhlo_version = 2;
  string producer_mlir_version = 3;
  uint64 bytecode_size_bytes = 4;
  string sha256_fingerprint = 5;
}

// Shardy (sdy) logical mesh axis descriptor.
message ShardyMeshAxisProto {
  string name = 1;
  int64 size = 2;
}

// Shardy (sdy) sub-axis slicing descriptor.
message ShardySubAxisInfoProto {
  int64 pre_size = 1;
  int64 size = 2;
}

// Shardy (sdy) axis reference descriptor.
message ShardyAxisRefProto {
  string name = 1;
  ShardySubAxisInfoProto sub_axis_info = 2;
}

// Shardy (sdy) per-dimension sharding descriptor.
message ShardyDimensionShardingProto {
  repeated ShardyAxisRefProto axes = 1;
  bool is_closed = 2;
  int64 priority = 3;
}

// Shardy (sdy) tensor sharding annotation descriptor.
message ShardyTensorShardingProto {
  string mesh_name = 1;
  repeated ShardyDimensionShardingProto dim_shardings = 2;
  repeated ShardyAxisRefProto replicated_axes = 3;
  repeated ShardyAxisRefProto unreduced_axes = 4;
}

// Shardy (sdy.mesh) logical mesh descriptor.
message ShardyMeshProto {
  string name = 1;
  repeated ShardyMeshAxisProto axes = 2;
  repeated int64 device_ids = 3;
}

// XLA FFI custom C++/Rust type registration metadata.
message XlaFfiTypeIdRegistrationProto {
  string type_name = 1;
  int64 type_id = 2;
  uint64 type_size_bytes = 3;
  uint64 type_align_bytes = 4;
}

// XLA FFI execution context metadata.
message XlaFfiExecutionContextMetadataProto {
  int32 run_id = 1;
  int32 device_ordinal = 2;
  uint64 stream_handle = 3;
  repeated XlaFfiTypeIdRegistrationProto registered_types = 4;
}
