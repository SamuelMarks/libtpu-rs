syntax = "proto3";

package libtpu.ext.hlo;

// Compiler pass record for a single rematerialized HLO instruction clone.
message RematerializedInstructionEntryProto {
  string original_instruction_name = 1;
  string clone_instruction_name = 2;
  uint32 original_bundle_pc = 3;
  uint32 rematerialized_bundle_pc = 4;
  uint64 saved_bytes = 5;
  uint32 recompute_cost_cycles = 6;
}

// Compiler pass summary produced by HLO rematerialization.
message HloRematerializationSummaryProto {
  string computation_name = 1;
  uint64 memory_limit_bytes = 2;
  uint64 peak_memory_before_bytes = 3;
  uint64 peak_memory_after_bytes = 4;
  uint32 rematerialized_count = 5;
  repeated RematerializedInstructionEntryProto entries = 6;
}

// Compiler pass record for an input-to-output zero-copy buffer donation alias.
message BufferDonationAliasEntryProto {
  uint32 output_tuple_index = 1;
  uint32 parameter_number = 2;
  uint32 parameter_tuple_index = 3;
  bool must_alias = 4;
  uint64 aliased_size_bytes = 5;
}

// Compiler pass summary for input-output buffer aliasing.
message InputOutputBufferAliasConfigProto {
  string module_name = 1;
  uint64 total_aliased_bytes = 2;
  repeated BufferDonationAliasEntryProto alias_entries = 3;
}
