[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "scripts.maturin_backend"
backend-path = ["."]

[project]
name = "libtpu"
version = "0.0.53.1"
description = "Clean-room Rust drop-in replacement for Google Cloud TPU runtime library (libtpu)."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0 OR MIT"

[project.optional-dependencies]
dev = [
    "maturin>=1.7,<2.0",
    "ml_dtypes>=0.4",
    "mypy>=1.8",
    "numpy>=1.26",
    "pre-commit>=3.7",
    "pyelftools>=0.31",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[tool.maturin]
manifest-path = "crates/libtpu-py/Cargo.toml"
python-source = "python"
module-name = "libtpu._C"
bindings = "pyo3"
features = ["extension-module"]
include = [
    { path = "python/libtpu/*.so", format = "wheel" },
    { path = "python/libtpu/*.dylib", format = "wheel" },
    { path = "python/libtpu/*.dll", format = "wheel" },
    { path = "python/libtpu/sdk/*.so", format = "wheel" },
    { path = "python/libtpu/sdk/*.dylib", format = "wheel" },
    { path = "python/libtpu/sdk/*.dll", format = "wheel" },
]

[tool.pytest.ini_options]
pythonpath = [".", "python"]
testpaths = ["python/tests"]

[tool.coverage.run]
branch = true
source = ["libtpu"]
omit = ["python/libtpu/__init__.pyi", "python/libtpu/sdk/*.pyi"]

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.mypy]
strict = true
python_version = "3.10"
mypy_path = "python"

[[tool.mypy.overrides]]
module = ["maturin", "ml_dtypes", "numpy", "numpy.*", "jax", "jax.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["scripts.maturin_backend", "libtpu._interop", "tests.*"]
disable_error_code = ["import-untyped"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["D", "E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "ARG", "RET"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["libtpu"]
