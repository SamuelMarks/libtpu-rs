[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "libtpu"
version = "0.0.50"
description = "Clean-room Rust drop-in replacement for Google Cloud TPU runtime library (libtpu)."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0 OR MIT"

[project.optional-dependencies]
dev = [
    "mypy>=1.8",
    "pyelftools>=0.31",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["python/libtpu"]
artifacts = [
    "python/libtpu/*.so",
    "python/libtpu/*.dylib",
    "python/libtpu/*.dll",
    "python/libtpu/sdk/*.so",
    "python/libtpu/sdk/*.dylib",
    "python/libtpu/sdk/*.dll",
]

[tool.hatch.build.targets.sdist]
include = [
    "python/libtpu",
    "README.md",
    "LICENSE-APACHE",
    "LICENSE-MIT",
]

[tool.pytest.ini_options]
pythonpath = [".", "python"]
testpaths = ["python/tests"]

[tool.coverage.run]
branch = true
source = ["libtpu"]
omit = ["python/libtpu/__init__.pyi"]

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.mypy]
strict = true
python_version = "3.9"
mypy_path = "python"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["D", "E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "ARG", "RET"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["libtpu"]
